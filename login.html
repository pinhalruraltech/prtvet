<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | APPVET</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
--color-primary:#2D6A4F;
--color-secondary:#74C69D;
--color-bg:#F5F7F9;
--color-white:#FFFFFF;
--color-text:#1F2933;
--color-muted:#6B7280;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
background:var(--color-bg);
min-height:100vh;
display:flex;
flex-direction:column;
}

.container{flex:1;display:flex;}

.left{
flex:1;
background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.left img{
max-width:320px;
width:90%;
margin-bottom:20px;
}

.clinic{color:#fff;font-size:20px;font-weight:600;}
.doctor{color:#fff;font-size:14px;opacity:0.9;}

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
padding:25px;
background:var(--color-white);
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.login-title{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.form-group{margin-bottom:12px;}

.form-group input{
width:100%;
padding:12px;
border:1.5px solid #D1D5DB;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:var(--color-primary);
color:#fff;
border:none;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

.alert{
display:none;
margin-bottom:10px;
padding:10px;
border-radius:6px;
font-size:13px;
}

.alert.error{background:#fdecea;color:#E63946;}
.alert.success{background:#e6f4ea;color:#2D6A4F;}

.footer{
text-align:center;
padding:20px;
font-size:12px;
color:#6B7280;
}
</style>

</head>

<body>

<div class="container">

<div class="left">

<img src="logo/logo_prt.png">

<div class="clinic">APPVET</div>
<div class="doctor">Sistema de Gestão Veterinária</div>

</div>

<div class="right">

<div class="login-box">

<h2>Login</h2>

<div id="alert" class="alert"></div>

<div class="form-group">
<input type="email" id="email" placeholder="Email">
</div>

<div class="form-group">
<input type="password" id="senha" placeholder="Senha">
</div>

<button onclick="login()">Entrar</button>

</div>

</div>

</div>

<div class="footer">
Versão 1.0.0 • Desenvolvido por PRT Soluções
</div>

<!-- 🔥 SCRIPT CORRETO -->
<script type="module">

import { auth, db } from "./js/firebase-init.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

function showAlert(msg, type){
    const alert = document.getElementById("alert");
    alert.innerText = msg;
    alert.className = "alert " + type;
    alert.style.display = "block";
}

window.login = async function(){

    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();

    try{

        const cred = await signInWithEmailAndPassword(auth, email, senha);
        const uid = cred.user.uid;

        // 🔎 busca usuário no Firestore
        const q = query(
            collection(db, "usuarios"),
            where("uid", "==", uid)
        );

        const snap = await getDocs(q);

        if (snap.empty) {
            showAlert("Usuário não encontrado", "error");
            return;
        }

        const user = snap.docs[0].data();

        if (!user.ativo) {
            showAlert("Usuário inativo", "error");
            return;
        }

        // 🔐 salva sessão COMPLETA
        localStorage.setItem("uid", uid);
        localStorage.setItem("clinicaId", user.clinicaId);
        localStorage.setItem("papel", user.grupo);

        showAlert("Login realizado com sucesso!", "success");

        setTimeout(()=>{
            window.location.href = "index.html";
        },800);

    }catch(e){

        switch(e.code){
            case "auth/user-not-found":
                showAlert("Usuário não encontrado", "error");
                break;
            case "auth/wrong-password":
                showAlert("Senha incorreta", "error");
                break;
            case "auth/invalid-email":
                showAlert("Email inválido", "error");
                break;
            default:
                showAlert("Erro: " + e.code, "error");
        }

    }

}

</script>

</body>
</html>
