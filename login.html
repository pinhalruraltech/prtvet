
<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
--color-primary:#2D6A4F;

/* 🔥 GRADIENTE MAIS CLARO (ajustado) */
--color-secondary:#8FD9C3;

--color-bg:#F5F7F9;
--color-white:#FFFFFF;
--color-text:#1F2933;
--color-muted:#6B7280;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
background:var(--color-bg);
min-height:100vh;
display:flex;
flex-direction:column;
}

.container{
flex:1;
display:flex;
}

/* ESQUERDA */
.left{
flex:1;
background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.left img{
max-width:260px;
width:80%;
margin-bottom:25px;
}

/* 🔥 TEXO ATUALIZADO */
.clinic{
color:#fff;
font-size:20px;
font-weight:600;
margin-bottom:4px;
}

.doctor{
color:#fff;
font-size:14px;
opacity:0.9;
}

/* DIREITA */
.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
padding:25px;
background:#fff;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.login-title{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.login-title svg{
width:22px;
height:22px;
}

/* FORM */
.form-group{
margin-bottom:12px;
}

.form-group label{
font-size:13px;
color:#6B7280;
}

.form-group input{
width:100%;
padding:12px;
border-radius:10px;
border:1.5px solid #D1D5DB;
font-size:14px;
}

.password-wrapper{
position:relative;
}

.password-wrapper svg{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
width:20px;
height:20px;
color:#6B7280;
}

/* BOTÃO */
button{
width:100%;
padding:12px;
background:var(--color-primary);
color:#fff;
border:none;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

/* ALERT */
.alert{
display:none;
margin-bottom:10px;
padding:10px;
border-radius:6px;
font-size:13px;
}

.alert.error{
background:#fdecea;
color:#E63946;
}

.alert.success{
background:#e6f4ea;
color:#2D6A4F;
}

.link{
margin-top:10px;
text-align:center;
font-size:13px;
}

/* FOOTER */
.footer{
text-align:center;
padding:20px;
font-size:12px;
color:#6B7280;
}

/* MOBILE */
@media(max-width:768px){

.container{
flex-direction:column;
}

.left{
height:45vh;
}

.right{
height:55vh;
align-items:flex-start;
}

.login-box{
margin-top:10px;
}
}
</style>

</head>

<body>

<div class="container">

<!-- ESQUERDA -->
<div class="left">

<img src="logo/logo_prt.png">

<div class="clinic">APPVET</div>
<div class="doctor">Sistema de Gestão Veterinária</div>

</div>

<!-- DIREITA -->
<div class="right">

<div class="login-box">

<div class="login-title">
<i data-lucide="lock"></i>
<h2>Login</h2>
</div>

<div id="alert" class="alert"></div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="form-group">
<label>Senha</label>

<div class="password-wrapper">
<input type="password" id="senha">
<i data-lucide="eye" onclick="toggleSenha()"></i>
</div>

</div>

<button onclick="login()">Entrar</button>

<div class="link">
<a href="#">Esqueceu a senha?</a>
</div>

</div>

</div>

</div>

<div class="footer">
Versão 1.0.0 • Desenvolvido por PRT Soluções
</div>

<script type="module">

import { auth, db } from "./js/firebase-init.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

function showAlert(msg, type){
    const alert = document.getElementById("alert");
    alert.innerText = msg;
    alert.className = "alert " + type;
    alert.style.display = "block";
}

window.login = async function(){

    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();

    try{

        const cred = await signInWithEmailAndPassword(auth, email, senha);
        const uid = cred.user.uid;

        const ref = doc(db, "usuarios", uid);
        const snap = await getDoc(ref);

        if (!snap.exists()) {
            showAlert("Usuário não encontrado", "error");
            return;
        }

        const user = snap.data();

        if (!user.ativo) {
            showAlert("Usuário inativo", "error");
            return;
        }

        localStorage.setItem("uid", uid);
        localStorage.setItem("clinicaId", user.clinicaId);
        localStorage.setItem("papel", user.grupo);

        showAlert("Login realizado com sucesso!", "success");

        setTimeout(()=>{
            window.location.href = "index.html";
        },800);

    }catch(e){
        showAlert("Erro: " + e.code, "error");
    }

}

window.toggleSenha = function(){
    const input = document.getElementById('senha');
    input.type = input.type === "password" ? "text" : "password";
}

lucide.createIcons();

</script>

</body>
</html>
