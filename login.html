<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | APPVET</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

:root{
--color-primary:#2D6A4F;
--color-secondary:#74C69D;
--color-bg:#F5F7F9;
--color-white:#FFFFFF;
--color-text:#1F2933;
--color-muted:#6B7280;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: 'Inter', sans-serif;
background:var(--color-bg);
min-height:100vh;
display:flex;
flex-direction:column;
}

.container{
flex:1;
display:flex;
}

.left{
flex:1;
background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.left img{
max-width:420px;
width:90%;
margin-bottom:20px;
}

.nome{
font-family:'Playfair Display', serif;
color:#000;
font-size:28px;
letter-spacing:2px;
margin-bottom:5px;
}

.subnome{
font-family:'Playfair Display', serif;
font-size:16px;
color:#000;
opacity:0.8;
}

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
padding:25px;
background:var(--color-white);
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.login-title{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
color:var(--color-text);
}

.login-title svg{
width:22px;
height:22px;
}

.password-wrapper{
position:relative;
}

.password-wrapper svg{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
width:20px;
height:20px;
color:#6B7280;
}

.form-group{
margin-bottom:12px;
}

.form-group label{
font-size:13px;
color:var(--color-muted);
}

.form-group input{
width:100%;
padding:10px;
border:1px solid #E3E8EE;
border-radius:8px;
}

button{
width:100%;
padding:11px;
background:var(--color-primary);
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

.link{
margin-top:8px;
text-align:center;
font-size:12px;
}

.alert{
display:none;
margin-bottom:10px;
padding:10px;
border-radius:6px;
font-size:13px;
}

.alert.error{
background:#fdecea;
color:#E63946;
}

.alert.success{
background:#e6f4ea;
color:#2D6A4F;
}

.footer{
height:40px;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
background:#fff;
border-top:1px solid #E3E8EE;
}

@media(max-width:768px){

.container{
flex-direction:column;
}

.left{
height:40vh;
}

.left img{
max-width:260px;
}

.nome{
font-size:20px;
}

.subnome{
font-size:13px;
}

.right{
height:60vh;
align-items:flex-start;
}

.login-box{
margin-top:10px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<img src="logo/logo_rafael.png">

<div class="nome">RAFAEL FRUTUOSO</div>
<div class="subnome">Médico Veterinário</div>

</div>

<div class="right">

<div class="login-box">

<div class="login-title">

<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<rect x="3" y="11" width="18" height="11" rx="2"/>
<path d="M7 11V7a5 5 0 0 1 10 0v4"/>
</svg>

<h2>Login</h2>

</div>

<div id="alert" class="alert"></div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="form-group">
<label>Senha</label>

<div class="password-wrapper">
<input type="password" id="senha">

<svg onclick="toggleSenha()" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
<circle cx="12" cy="12" r="3"/>
</svg>

</div>

</div>

<button onclick="login()">Entrar</button>

<div class="link">
<a href="#">Esqueceu a senha?</a>
</div>

</div>

</div>

</div>

<div class="footer">
Versão 1.0 | Suporte | Termos | Desenvolvido por PRT Soluções
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔴 COLE SUA API KEY AQUI */
const firebaseConfig = {
apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
authDomain: "appvet-prt.firebaseapp.com",
projectId: "appvet-prt",
storageBucket: "appvet-prt.firebasestorage.app",
messagingSenderId: "26046923372",
appId: "1:26046923372:web:fdbe180eadced87018e49"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function showAlert(msg, type){
const alert = document.getElementById("alert");
alert.innerText = msg;
alert.className = "alert " + type;
alert.style.display = "block";
}

window.login = async function(){

const email = document.getElementById('email').value;
const senha = document.getElementById('senha').value;

try{

await signInWithEmailAndPassword(auth, email, senha);

showAlert("Login realizado com sucesso!", "success");

setTimeout(()=>{
window.location.href = "appvet/index.html";
},1000);

}catch(e){

switch(e.code){

case "auth/user-not-found":
showAlert("Usuário não encontrado", "error");
break;

case "auth/wrong-password":
showAlert("Senha incorreta", "error");
break;

case "auth/invalid-email":
showAlert("Email inválido", "error");
break;

case "auth/invalid-api-key":
showAlert("API Key inválida", "error");
break;

default:
showAlert("Erro: " + e.code, "error");

}

}

}

window.toggleSenha = function(){
const input = document.getElementById('senha');
input.type = input.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
