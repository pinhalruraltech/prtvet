<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cliente | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<!-- 🔐 PERMISSÃO -->
<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "clientes"
};
</script>

<!-- 🔐 AUTH -->
<script type="module" src="../js/auth-guard.js"></script>

<style>

/* (SEU CSS ORIGINAL — NÃO ALTEREI NADA) */

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#F5F7F9;
}

.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-size:18px;
    font-weight:600;
}

.container{
    padding:16px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 10px rgba(0,0,0,0.04);
}

label{
    font-size:13px;
    color:#6B7280;
    display:block;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1.8px solid #CBD5E1;
    margin-bottom:12px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-weight:600;
    margin-top:6px;
}

.btn-primary{
    background:#2D6A4F;
    color:#fff;
}

.btn-secondary{
    background:#E5E7EB;
}

.photo{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#ddd;
    margin:auto;
    margin-bottom:10px;
}

.animal-item{
    padding:12px;
    border-radius:10px;
    background:#F9FAFB;
    margin-bottom:8px;
    cursor:pointer;
}

.hidden{
    display:none;
}

</style>

</head>

<body style="display:none;">

<div id="menu-container"></div>

<div class="header">
    Cliente
</div>

<div class="container">

<div class="card">
    <div class="photo"></div>
    <button class="btn btn-secondary">Alterar Foto</button>
</div>

<div class="card">

<label>Nome</label>
<input id="nome">

<label>Telefone</label>
<input id="telefone">

<label>Rua</label>
<input id="logradouro">

<label>Número</label>
<input id="numero">

<label>Bairro</label>
<input id="bairro">

<label>Cidade</label>
<input id="cidade">

<label>Estado</label>
<input id="estado">

</div>

<div class="card">

<button class="btn btn-primary hidden" id="btnSalvar">Salvar</button>
<button class="btn btn-secondary hidden" id="btnCancelar">Cancelar</button>
<button class="btn btn-primary" id="btnEditar">Editar</button>

</div>

<div class="card">

<strong>Animais</strong>

<div id="listaAnimais"></div>

<button class="btn btn-primary" onclick="novoAnimal()">
    + Novo Animal
</button>

</div>

</div>

<div style="text-align:center;padding:20px;font-size:12px;color:#6B7280;">
Versão 1.0.0 • Desenvolvido por PRT Soluções
</div>

<!-- 🔥 SCRIPT PRINCIPAL -->
<script type="module">

import { db } from "../js/firebase-init.js";
import { carregarClinica } from "../js/clinica-loader.js";
import { carregarMenu } from "../menu/menu.js";

import {
    doc,
    getDoc,
    updateDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔐 CONTEXTO */
const uid = localStorage.getItem("uid");
const clinicaId = localStorage.getItem("clinicaId");

if(!uid || !clinicaId){
    window.location.href = "../login.html";
}

/* 🔧 CLÍNICA */
await carregarClinica();

/* 🔥 MENU */
fetch("../menu/menu.html")
.then(res => res.text())
.then(html => {

    document.getElementById("menu-container").innerHTML = html;

    document.querySelectorAll(".menu-item").forEach(link=>{
        if(link.getAttribute("data-link") === "clientes"){
            link.classList.add("active");
        }
    });

    carregarMenu();

    setTimeout(()=>{
        lucide.createIcons();
        document.body.style.display = "block";
    },100);

});

/* 🔥 LÓGICA DA PÁGINA */
const urlParams = new URLSearchParams(window.location.search);
const clienteId = urlParams.get("id");

let modoEdicao = false;
let dadosOriginais = {};

/* CLIENTE */
async function carregarCliente(){

    if(!clienteId) return;

    const ref = doc(db, "clientes", clienteId);
    const snap = await getDoc(ref);

    const data = snap.data();

    dadosOriginais = data;

    nome.value = data.nome || "";
    telefone.value = data.telefone || "";

    logradouro.value = data.endereco?.logradouro || "";
    numero.value = data.endereco?.numero || "";
    bairro.value = data.endereco?.bairro || "";
    cidade.value = data.endereco?.cidade || "";
    estado.value = data.endereco?.estado || "";
}

carregarCliente();

/* ANIMAIS */
async function carregarAnimais(){

    const q = query(
        collection(db,"animais"),
        where("clienteId","==",clienteId)
    );

    const snapshot = await getDocs(q);

    listaAnimais.innerHTML = "";

    snapshot.forEach(docItem=>{
        const d = docItem.data();

        const div = document.createElement("div");
        div.className = "animal-item";
        div.innerText = d.nome;

        div.onclick = ()=>{
            window.location.href = `animal.html?id=${docItem.id}`;
        };

        listaAnimais.appendChild(div);
    });
}

carregarAnimais();

/* EDITAR */
btnEditar.onclick = ()=>{
    modoEdicao = true;
    toggleBotoes(true);
};

/* SALVAR */
btnSalvar.onclick = async ()=>{

    if(!confirm("Salvar alterações?")) return;

    await updateDoc(doc(db,"clientes",clienteId),{
        nome: nome.value,
        telefone: telefone.value,
        endereco:{
            logradouro: logradouro.value,
            numero: numero.value,
            bairro: bairro.value,
            cidade: cidade.value,
            estado: estado.value
        }
    });

    alert("Salvo com sucesso");

    modoEdicao = false;
    toggleBotoes(false);
};

/* CANCELAR */
btnCancelar.onclick = ()=>{

    if(!confirm("Cancelar alterações?")) return;

    carregarCliente();

    modoEdicao = false;
    toggleBotoes(false);
};

/* BOTÕES */
function toggleBotoes(editando){

    btnSalvar.classList.toggle("hidden", !editando);
    btnCancelar.classList.toggle("hidden", !editando);
    btnEditar.classList.toggle("hidden", editando);

}

/* NOVO ANIMAL */
window.novoAnimal = ()=>{
    window.location.href = `animal.html?clienteId=${clienteId}`;
};

</script>

</body>
</html>
