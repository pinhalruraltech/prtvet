<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cliente | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<style>

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#F5F7F9;
}

/* HEADER */
.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-size:18px;
    font-weight:600;
}

/* CONTAINER */
.container{
    padding:16px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 10px rgba(0,0,0,0.04);
}

/* INPUT */
label{
    font-size:13px;
    color:#6B7280;
    display:block;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1.8px solid #CBD5E1;
    margin-bottom:12px;
}

/* BOTÕES */
.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-weight:600;
    margin-top:6px;
}

.btn-primary{
    background:#2D6A4F;
    color:#fff;
}

.btn-secondary{
    background:#E5E7EB;
}

/* FOTO */
.photo{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#ddd;
    margin:auto;
    margin-bottom:10px;
}

/* ANIMAIS */
.animal-item{
    padding:12px;
    border-radius:10px;
    background:#F9FAFB;
    margin-bottom:8px;
    cursor:pointer;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div id="menu-container"></div>

<div class="header">
    Cliente
</div>

<div class="container">

<!-- FOTO -->
<div class="card">
    <div class="photo"></div>
    <button class="btn btn-secondary">Alterar Foto</button>
</div>

<!-- DADOS -->
<div class="card">

<label>Nome</label>
<input id="nome">

<label>Telefone</label>
<input id="telefone">

<label>Rua</label>
<input id="logradouro">

<label>Número</label>
<input id="numero">

<label>Bairro</label>
<input id="bairro">

<label>Cidade</label>
<input id="cidade">

<label>Estado</label>
<input id="estado">

</div>

<!-- AÇÕES -->
<div class="card">

<button class="btn btn-primary hidden" id="btnSalvar">Salvar</button>
<button class="btn btn-secondary hidden" id="btnCancelar">Cancelar</button>
<button class="btn btn-primary" id="btnEditar">Editar</button>

</div>

<!-- ANIMAIS -->
<div class="card">

<strong>Animais</strong>

<div id="listaAnimais"></div>

<button class="btn btn-primary" onclick="novoAnimal()">
    + Novo Animal
</button>

</div>

</div>

<div style="text-align:center;padding:20px;font-size:12px;color:#6B7280;">
Versão 1.0.0 • Desenvolvido por PRT Soluções
</div>

<script type="module">

import { db } from "../js/firebase-init.js";
import {
    doc,
    getDoc,
    updateDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const urlParams = new URLSearchParams(window.location.search);
const clienteId = urlParams.get("id");

let modoEdicao = false;
let dadosOriginais = {};

/* CARREGAR CLIENTE */
async function carregarCliente(){

    if(!clienteId) return;

    const ref = doc(db, "clientes", clienteId);
    const snap = await getDoc(ref);

    const data = snap.data();

    dadosOriginais = data;

    document.getElementById("nome").value = data.nome || "";
    document.getElementById("telefone").value = data.telefone || "";

    document.getElementById("logradouro").value = data.endereco?.logradouro || "";
    document.getElementById("numero").value = data.endereco?.numero || "";
    document.getElementById("bairro").value = data.endereco?.bairro || "";
    document.getElementById("cidade").value = data.endereco?.cidade || "";
    document.getElementById("estado").value = data.endereco?.estado || "";

}

carregarCliente();

/* ANIMAIS */
async function carregarAnimais(){

    const q = query(collection(db,"animais"), where("clienteId","==",clienteId));
    const snapshot = await getDocs(q);

    const lista = document.getElementById("listaAnimais");
    lista.innerHTML = "";

    snapshot.forEach(doc=>{
        const d = doc.data();

        const div = document.createElement("div");
        div.className = "animal-item";
        div.innerText = d.nome;

        div.onclick = ()=>{
            window.location.href = `animal.html?id=${doc.id}`;
        };

        lista.appendChild(div);
    });

}

carregarAnimais();

/* EDITAR */
document.getElementById("btnEditar").onclick = ()=>{
    modoEdicao = true;

    toggleBotoes(true);
}

/* SALVAR */
document.getElementById("btnSalvar").onclick = async ()=>{

    if(!confirm("Salvar alterações?")) return;

    const ref = doc(db,"clientes",clienteId);

    await updateDoc(ref,{
        nome: document.getElementById("nome").value,
        telefone: document.getElementById("telefone").value,
        endereco:{
            logradouro: document.getElementById("logradouro").value,
            numero: document.getElementById("numero").value,
            bairro: document.getElementById("bairro").value,
            cidade: document.getElementById("cidade").value,
            estado: document.getElementById("estado").value
        }
    });

    alert("Salvo com sucesso");

    modoEdicao = false;
    toggleBotoes(false);
}

/* CANCELAR */
document.getElementById("btnCancelar").onclick = ()=>{

    if(!confirm("Cancelar alterações?")) return;

    carregarCliente();

    modoEdicao = false;
    toggleBotoes(false);
}

/* BOTÕES */
function toggleBotoes(editando){

    document.getElementById("btnSalvar").classList.toggle("hidden", !editando);
    document.getElementById("btnCancelar").classList.toggle("hidden", !editando);
    document.getElementById("btnEditar").classList.toggle("hidden", editando);

}

/* NOVO ANIMAL */
window.novoAnimal = ()=>{
    window.location.href = `animal.html?clienteId=${clienteId}`;
}

</script>

<script>

/* MENU */
fetch("../menu/menu.html")
.then(res => res.text())
.then(data => {
    document.getElementById("menu-container").innerHTML = data;

    const script = document.createElement("script");
    script.src = "../menu/menu.js";
    document.body.appendChild(script);

    setTimeout(()=>{
        if(typeof initMenu === "function"){
            initMenu();
        }
        lucide.createIcons();
    },100);
});

</script>

</body>
</html>
