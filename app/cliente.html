<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cliente | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "clientes"
};
</script>

<script type="module" src="../js/auth-guard.js"></script>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter';background:#F5F7F9;}

.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

.container{padding:16px;}

.card{
    background:#fff;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #E5E7EB;
}

label{
    font-size:13px;
    color:#6B7280;
    display:block;
    margin-bottom:4px;
}

input, select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #CBD5E1;
    margin-bottom:10px;
}

.photo{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#ddd;
    background-size:cover;
    background-position:center;
    margin:auto;
    margin-bottom:10px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-weight:600;
    margin-top:6px;
}

.btn-primary{background:#2D6A4F;color:#fff;}
.btn-secondary{background:#E5E7EB;}

.animal-item{
    display:flex;
    gap:10px;
    background:#F9FAFB;
    padding:10px;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
}

.foto-animal{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ddd;
    background-size:cover;
}

.hidden{display:none;}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:#fff;
    width:95%;
    max-width:520px;
    max-height:90vh;
    overflow:auto;
    border-radius:16px;
    padding:16px;
}
</style>

</head>

<body style="display:none;">

<div id="menu-container"></div>

<div class="header">
    <i data-lucide="user"></i>
    Cliente
</div>

<div class="container">

<!-- FOTO -->
<div class="card">
    <div class="photo" id="fotoPreview"></div>

    <button class="btn btn-secondary" onclick="alterarFoto()">Alterar Foto</button>
    <button class="btn btn-secondary" onclick="removerFoto()">Remover Foto</button>

    <input type="file" id="fotoInput" class="hidden">
</div>

<!-- DADOS -->
<div class="card">

<label>Tipo</label>
<select id="tipoDoc">
<option value="cpf">CPF</option>
<option value="cnpj">CNPJ</option>
</select>

<label>Documento</label>
<input id="documento">

<label>Nome</label>
<input id="nome">

</div>

<!-- CONTATO -->
<div class="card">

<label>Telefone fixo</label>
<input id="telefoneFixo">

<label>Celular</label>
<input id="telefoneCelular">

<label>Email</label>
<input id="email">

</div>

<!-- ENDEREÇO -->
<div class="card">

<label>CEP</label>
<input id="cep">

<label>Logradouro</label>
<input id="logradouro">

<label>Número</label>
<input id="numero">

<label>Bairro</label>
<input id="bairro">

<label>Cidade</label>
<input id="cidade">

<label>Estado</label>
<input id="estado">

</div>

<!-- AÇÕES -->
<div class="card">
<button class="btn btn-primary hidden" id="btnSalvar">Salvar</button>
<button class="btn btn-secondary hidden" id="btnCancelar">Cancelar</button>
<button class="btn btn-primary" id="btnEditar">Editar</button>
</div>

<!-- ANIMAIS -->
<div class="card">

<strong>Animais</strong>

<div id="listaAnimais"></div>

<button class="btn btn-primary" onclick="abrirModalAnimal()">
+ Novo Animal
</button>

</div>

</div>

<!-- MODAL ANIMAL -->
<div class="modal" id="modalAnimal">
<div class="modal-content">

<h3>Cadastro de Animal</h3>

<label>Nome</label>
<input id="animalNome">

<label>Espécie</label>
<select id="especie">
<option>Cachorro</option>
<option>Gato</option>
<option>Outro</option>
</select>

<label>Data de nascimento</label>
<input type="date" id="nascimento">

<label>Raça</label>
<input id="raca">

<label>Peso</label>
<input id="peso">

<label>Altura</label>
<input id="altura">

<label>Comprimento</label>
<input id="comprimento">

<label>Alergias</label>
<input id="alergias">

<label>Doenças crônicas</label>
<input id="doencas">

<label>Cirurgias</label>
<input id="cirurgias">

<label>Foto</label>
<input type="file" id="fotoAnimal">

<button class="btn btn-primary" onclick="salvarAnimal()">Salvar Animal</button>
<button class="btn btn-secondary" onclick="modalAnimal.style.display='none'">Cancelar</button>

</div>
</div>

<script type="module">

import { db, storage } from "../js/firebase-init.js";
import { carregarClinica } from "../js/clinica-loader.js";
import { carregarMenu } from "../menu/menu.js";

import {
doc,getDoc,updateDoc,collection,query,where,getDocs,addDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const uid = localStorage.getItem("uid");
const clinicaId = localStorage.getItem("clinicaId");

if(!uid || !clinicaId){
    window.location.href="../login.html";
}

await carregarClinica();

/* MENU */
fetch("../menu/menu.html")
.then(r=>r.text())
.then(async html=>{
document.getElementById("menu-container").innerHTML=html;

const m = await import("../menu/menu.js");
m.initMenu();
await m.carregarMenu();

document.querySelector('[data-link="clientes"]').classList.add("active");

lucide.createIcons();
document.body.style.display="block";
});

/* CLIENTE */
const urlParams = new URLSearchParams(window.location.search);
const clienteId = urlParams.get("id");

let clienteData={};

/* CARREGAR */
async function carregarCliente(){

const snap = await getDoc(doc(db,"clientes",clienteId));
const d = snap.data();

clienteData=d;

nome.value=d.nome||"";
documento.value=d.documento||"";
telefoneFixo.value=d.telefoneFixo||"";
telefoneCelular.value=d.telefoneCelular||"";
email.value=d.email||"";

logradouro.value=d.endereco?.logradouro||"";
numero.value=d.endereco?.numero||"";
bairro.value=d.endereco?.bairro||"";
cidade.value=d.endereco?.cidade||"";
estado.value=d.endereco?.estado||"";
cep.value=d.endereco?.cep||"";

fotoPreview.style.backgroundImage=`url('${d.foto||""}')`;

}

carregarCliente();

/* FOTO */
window.alterarFoto=()=>{
if(confirm("Alterar foto?")) fotoInput.click();
};

fotoInput.onchange=async()=>{

const file=fotoInput.files[0];
if(!file)return;

const refStorage=ref(storage,"clientes/"+Date.now());
await uploadBytes(refStorage,file);
const url=await getDownloadURL(refStorage);

await updateDoc(doc(db,"clientes",clienteId),{foto:url});

carregarCliente();
};

window.removerFoto=async()=>{
if(!confirm("Remover foto?")) return;

await updateDoc(doc(db,"clientes",clienteId),{foto:""});
carregarCliente();
};

/* ANIMAIS */
async function carregarAnimais(){

const q=query(collection(db,"animais"),where("clienteId","==",clienteId));
const snap=await getDocs(q);

listaAnimais.innerHTML="";

snap.forEach(docItem=>{
const d=docItem.data();

const div=document.createElement("div");
div.className="animal-item";

div.innerHTML=`
<div class="foto-animal" style="background-image:url('${d.foto||""}')"></div>
<div>
<strong>${(d.nome||"").toUpperCase()}</strong>
<div class="sub">${d.especie||""}</div>
</div>
`;

div.onclick=()=>window.location.href=`animal.html?id=${docItem.id}`;

listaAnimais.appendChild(div);
});

}

carregarAnimais();

/* MODAL */
window.abrirModalAnimal=()=>modalAnimal.style.display="flex";

/* SALVAR ANIMAL */
window.salvarAnimal=async()=>{

let fotoURL="";
const file=fotoAnimal.files[0];

if(file){
const r=ref(storage,"animais/"+Date.now());
await uploadBytes(r,file);
fotoURL=await getDownloadURL(r);
}

await addDoc(collection(db,"animais"),{
clinicaId,
clienteId,
nome:animalNome.value,
especie:especie.value,
nascimento:nascimento.value,
raca:raca.value,
peso:peso.value,
altura:altura.value,
comprimento:comprimento.value,
alergias:alergias.value,
doencas:doencas.value,
cirurgias:cirurgias.value,
foto:fotoURL,
createdAt:serverTimestamp()
});

modalAnimal.style.display="none";
carregarAnimais();

};

</script>

</body>
</html>
