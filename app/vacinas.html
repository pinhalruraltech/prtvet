<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vacinas | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "vacinas"
};
</script>

<script type="module" src="../js/auth-guard.js"></script>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter';background:#F5F7F9;}

.header{
    padding:16px;
    color:#fff;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

.container{padding:12px;}

.top{
    background:#fff;
    padding:12px;
    border-bottom:1px solid #E5E7EB;
}

.top input, .top select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #CBD5E1;
    margin-bottom:8px;
}

/* 🔥 CARD MELHORADO */
.card{
    background:#fff;
    padding:16px;
    border-radius:14px;
    margin-bottom:12px;

    border-left:12px solid #ccc;

    border-top:1px solid #E5E7EB;
    border-right:1px solid #E5E7EB;
    border-bottom:1px solid #E5E7EB;

    box-shadow:0 6px 12px rgba(0,0,0,0.05);
    transition:0.2s;
}

.card:hover{
    transform:translateY(-2px);
}

/* CORES FORTES */
.card.atrasado{border-left-color:#DC2626;}
.card.pendente{border-left-color:#F59E0B;}
.card.finalizado{border-left-color:#16A34A;}

.nome{
    font-weight:700;
    text-transform:uppercase;
    font-size:15px;
}

.sub{
    font-size:13px;
    color:#6B7280;
}

.status{
    margin-top:6px;
    font-size:13px;
    font-weight:600;
}

/* PAGINAÇÃO */
.paginacao{
    text-align:center;
    margin-top:10px;
}

.btn-page{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid #CBD5E1;
    background:#fff;
    margin:2px;
    cursor:pointer;
}
</style>

</head>

<body style="display:none;">

<div id="menu-container"></div>

<div class="header" id="header">
    <i data-lucide="syringe"></i>
    Vacinas
</div>

<div class="top">
<input id="busca" placeholder="Buscar vacina, animal ou cliente">
<select id="filtro">
<option value="">Todas</option>
<option value="atrasado">Atrasadas</option>
<option value="pendente">Pendentes</option>
<option value="finalizado">Finalizadas</option>
</select>
</div>

<div class="container" id="lista"></div>
<div class="paginacao" id="paginacao"></div>

<script type="module">

import { db } from "../js/firebase-init.js";
import { carregarClinica } from "../js/clinica-loader.js";

import {
collection,getDocs,query,where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const uid = localStorage.getItem("uid");
const clinicaId = localStorage.getItem("clinicaId");

if(!uid || !clinicaId){
    window.location.href="../login.html";
}

const lista = document.getElementById("lista");
const busca = document.getElementById("busca");
const filtro = document.getElementById("filtro");
const paginacao = document.getElementById("paginacao");

let vacinas = [];
let clientesMap = {};
let animaisMap = {};

let paginaAtual = 1;
const POR_PAGINA = 20;

async function init(){

    await carregarClinica();

    const html = await fetch("../menu/menu.html").then(r=>r.text());
    document.getElementById("menu-container").innerHTML = html;

    const m = await import("../menu/menu.js");
    m.initMenu();
    await m.carregarMenu();

    document.querySelector('[data-link="vacinas"]').classList.add("active");

    const cor = document.getElementById("menuWrapper")?.style.background;
    if(cor){
        document.getElementById("header").style.background = cor;
    }

    busca.addEventListener("input", aplicarFiltros);
    filtro.addEventListener("change", aplicarFiltros);

    await carregarRelacionamentos();
    await carregarVacinas();

    lucide.createIcons();
    document.body.style.display="block";
}

/* MAPS */
async function carregarRelacionamentos(){

    const clientesSnap = await getDocs(query(
        collection(db,"clientes"),
        where("clinicaId","==",clinicaId)
    ));

    clientesSnap.forEach(doc=>{
        clientesMap[doc.id] = doc.data().nome;
    });

    const animaisSnap = await getDocs(query(
        collection(db,"animais"),
        where("clinicaId","==",clinicaId)
    ));

    animaisSnap.forEach(doc=>{
        animaisMap[doc.id] = doc.data().nome;
    });
}

/* VACINAS */
async function carregarVacinas(){

    const snap = await getDocs(query(
        collection(db,"vacinas"),
        where("clinicaId","==",clinicaId)
    ));

    vacinas = [];

    snap.forEach(doc=>{
        const v = doc.data();
        v.id = doc.id;
        vacinas.push(v);
    });

    ordenar();
    render();
}

/* CLASSIFICAÇÃO */
function classificar(v){

    if(v.status === "finalizado") return "finalizado";

    if(!v.proximaDose) return "pendente";

    const hoje = new Date();
    const prox = new Date(v.proximaDose);

    const diff = Math.ceil((prox-hoje)/(1000*60*60*24));

    if(diff < 0) return "atrasado";

    return "pendente";
}

/* ORDEM */
function ordenar(){

    vacinas.sort((a,b)=>{

        const ordem = {atrasado:0,pendente:1,finalizado:2};

        const tipoA = classificar(a);
        const tipoB = classificar(b);

        if(ordem[tipoA] !== ordem[tipoB]){
            return ordem[tipoA] - ordem[tipoB];
        }

        return new Date(a.proximaDose||999999999) - new Date(b.proximaDose||999999999);

    });

}

/* FILTRO */
function aplicarFiltros(){

    const termo = busca.value.toLowerCase();
    const tipoFiltro = filtro.value;

    let filtrado = vacinas.filter(v=>{

        const nome = (v.nome||"").toLowerCase();
        const animal = (animaisMap[v.animalId]||"").toLowerCase();
        const cliente = (clientesMap[v.clienteId]||"").toLowerCase();

        const tipo = classificar(v);

        return (
            (!termo || nome.includes(termo) || animal.includes(termo) || cliente.includes(termo)) &&
            (!tipoFiltro || tipo === tipoFiltro)
        );
    });

    paginaAtual = 1;
    render(filtrado);
}

/* RENDER */
function render(listaFiltrada = vacinas){

    lista.innerHTML = "";

    const inicio = (paginaAtual-1)*POR_PAGINA;
    const pagina = listaFiltrada.slice(inicio, inicio+POR_PAGINA);

    pagina.forEach(v=>{

        const tipo = classificar(v);

        const animal = animaisMap[v.animalId] || "-";
        const cliente = clientesMap[v.clienteId] || "-";

        const tipoMed = v.tipoMedicacao || "-";
        const dose = v.dose || "-";
        const unidade = v.unidadeDose || "";

        let statusTexto = "";

        if(tipo === "atrasado"){
            const dias = Math.abs(Math.ceil((new Date(v.proximaDose)-new Date())/(1000*60*60*24)));
            statusTexto = `Atrasada há ${dias} dias`;
        }

        if(tipo === "pendente" && v.proximaDose){
            const dias = Math.ceil((new Date(v.proximaDose)-new Date())/(1000*60*60*24));
            statusTexto = dias === 0 ? "Reaplicar hoje" : `Reaplicar em ${dias} dias`;
        }

        if(tipo === "finalizado"){
            statusTexto = "Finalizada";
        }

        const div = document.createElement("div");
        div.className = `card ${tipo}`;

        div.innerHTML = `
            <div class="nome">${(v.nome||"").toUpperCase()}</div>
            <div class="sub">${animal} • ${cliente}</div>
            <div class="sub">${tipoMed} | ${dose} ${unidade}</div>
            <div class="sub">Aplicada: ${v.dataAplicacao || "-"}</div>
            <div class="status">${statusTexto}</div>
        `;

        div.onclick = ()=>{
            window.location.href = `vacina.html?id=${v.id}`;
        };

        lista.appendChild(div);
    });

    renderPaginacao(listaFiltrada.length);
}

/* PAGINAÇÃO */
function renderPaginacao(total){

    paginacao.innerHTML = "";

    const totalPaginas = Math.ceil(total / POR_PAGINA);

    for(let i=1;i<=totalPaginas;i++){

        const btn = document.createElement("button");
        btn.className = "btn-page";
        btn.innerText = i;

        btn.onclick = ()=>{
            paginaAtual = i;
            render();
        };

        paginacao.appendChild(btn);
    }
}

init();

</script>

</body>
</html>
