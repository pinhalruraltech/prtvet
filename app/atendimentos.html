<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<style>
body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#F5F7F9;
    color:#1F2933;
}

/* HEADER */
.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-size:18px;
    font-weight:600;
}

/* CONTAINER */
.container{
    padding:16px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 6px rgba(0,0,0,0.05);
}

/* INPUTS */
label{
    font-size:13px;
    color:#6B7280;
    display:block;
    margin-bottom:6px;
}

input, select, textarea{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #E3E8EE;
    font-size:15px;
    margin-bottom:12px;
}

/* BOTÕES */
.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    margin-top:10px;
}

.btn-primary{
    background:#2D6A4F;
    color:#fff;
}

.btn-secondary{
    background:#E3E8EE;
}

/* MINI CARD ANIMAL */
.animal-card{
    display:flex;
    gap:12px;
    align-items:center;
}

.animal-photo{
    width:60px;
    height:60px;
    border-radius:12px;
    background:#ddd;
}

.small{
    font-size:13px;
    color:#6B7280;
}

</style>
</head>

<body>

<div class="header">
    Atendimento
</div>

<div class="container">

    <!-- ANIMAL -->
    <div class="card">
        <label>Selecionar Animal</label>
        <select id="animalSelect"></select>
    </div>

    <!-- RESUMO -->
    <div class="card" id="animalResumo">
        <div class="animal-card">
            <div class="animal-photo"></div>
            <div>
                <strong id="animalNome">-</strong>
                <div class="small" id="animalInfo"></div>
            </div>
        </div>
    </div>

    <!-- FORM -->
    <div class="card">

        <label>Tipo de atendimento</label>
        <select id="tipo">
            <option>Consulta</option>
            <option>Vacina</option>
            <option>Procedimento</option>
            <option>Cirurgia</option>
            <option>Emergência</option>
        </select>

        <label>Sintomas</label>
        <textarea id="sintomas" rows="3"></textarea>

        <label>Diagnóstico</label>
        <textarea id="diagnostico" rows="3"></textarea>

        <label>Procedimentos</label>
        <textarea id="procedimentos" rows="3"></textarea>

        <label>Observações</label>
        <textarea id="observacoes" rows="3"></textarea>

    </div>

    <!-- MEDICAMENTOS -->
    <div class="card">
        <label>Medicamentos aplicados</label>

        <select id="medicamento"></select>
        <input type="text" id="dose" placeholder="Dose">
        <select id="via">
            <option>IM</option>
            <option>SC</option>
            <option>Oral</option>
        </select>
    </div>

    <!-- RETORNO -->
    <div class="card">
        <label>Agendar retorno</label>
        <input type="date" id="dataRetorno">
        <input type="time" id="horaRetorno">
    </div>

    <!-- BOTÕES -->
    <button class="btn btn-primary" onclick="salvarAtendimento()">
        Salvar Atendimento
    </button>

</div>

<script type="module">

import { db } from "../js/firebase-init.js";
import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// CARREGAR ANIMAIS
async function carregarAnimais(){
    const snapshot = await getDocs(collection(db, "animais"));
    const select = document.getElementById("animalSelect");

    snapshot.forEach(doc=>{
        const data = doc.data();
        const option = document.createElement("option");
        option.value = doc.id;
        option.textContent = data.nome;
        select.appendChild(option);
    });
}

carregarAnimais();

// SALVAR
window.salvarAtendimento = async function(){

    const animalId = document.getElementById("animalSelect").value;

    const data = {
        animalId: animalId,
        tipo: document.getElementById("tipo").value,
        sintomas: document.getElementById("sintomas").value,
        diagnostico: document.getElementById("diagnostico").value,
        procedimentos: document.getElementById("procedimentos").value,
        observacoes: document.getElementById("observacoes").value,
        medicamento: document.getElementById("medicamento").value,
        dose: document.getElementById("dose").value,
        via: document.getElementById("via").value,
        dataRetorno: document.getElementById("dataRetorno").value,
        horaRetorno: document.getElementById("horaRetorno").value,
        createdAt: serverTimestamp()
    };

    await addDoc(collection(db, "atendimentos"), data);

    alert("Atendimento salvo com sucesso!");

}

</script>

<script>
lucide.createIcons();
</script>

</body>
</html>
