<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#F5F7F9;
    color:#1F2933;
}

/* HEADER */
.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-size:18px;
    font-weight:600;
}

/* CONTAINER */
.container{
    padding:16px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 6px rgba(0,0,0,0.05);
}

/* INPUTS */
label{
    font-size:13px;
    color:#6B7280;
    display:block;
    margin-bottom:6px;
}

input, select, textarea{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1.5px solid #D1D5DB;
    font-size:15px;
    margin-bottom:12px;
}

/* BOTÕES */
.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    margin-top:8px;
}

.btn-primary{
    background:#2D6A4F;
    color:#fff;
}

.btn-option{
    background:#E8F5E9;
    color:#2D6A4F;
    margin-bottom:8px;
}

/* MINI CARD */
.animal-card{
    display:flex;
    gap:12px;
    align-items:center;
}

.animal-photo{
    width:60px;
    height:60px;
    border-radius:12px;
    background:#ddd;
}

.small{
    font-size:13px;
    color:#6B7280;
}

/* HIDDEN */
.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="header">
    <i data-lucide="stethoscope"></i> Atendimento
</div>

<div class="container">

<!-- ANIMAL -->
<div class="card">
    <label>Selecionar Animal</label>
    <select id="animalSelect"></select>
</div>

<!-- RESUMO -->
<div class="card">
    <div class="animal-card">
        <div class="animal-photo"></div>
        <div>
            <strong id="animalNome">-</strong>
            <div class="small">Resumo rápido do paciente</div>
        </div>
    </div>
</div>

<!-- FORM -->
<div class="card">

    <label>Tipo de atendimento</label>
    <select id="tipo">
        <option>Consulta</option>
        <option>Vacina</option>
        <option>Procedimento</option>
        <option>Cirurgia</option>
        <option>Emergência</option>
    </select>

    <label>Sintomas</label>
    <textarea id="sintomas"></textarea>

    <label>Diagnóstico</label>
    <textarea id="diagnostico"></textarea>

    <label>Procedimentos</label>
    <textarea id="procedimentos"></textarea>

    <label>Observações</label>
    <textarea id="observacoes"></textarea>

</div>

<!-- EVOLUÇÃO -->
<div class="card">
    <label>Evolução do paciente</label>

    <button class="btn btn-option" onclick="toggle('vacinaBox')">
        💉 Nova Vacina
    </button>

    <button class="btn btn-option" onclick="toggle('medicacaoBox')">
        💊 Prescrever Medicação
    </button>

    <button class="btn btn-option" onclick="toggle('exameBox')">
        🧪 Solicitar Exame
    </button>

    <button class="btn btn-option" onclick="toggle('internacaoBox')">
        🏥 Internação
    </button>

</div>

<!-- VACINA -->
<div class="card hidden" id="vacinaBox">
    <label>Nome da vacina</label>
    <input type="text" id="vacinaNome">

    <label>Data</label>
    <input type="date" id="vacinaData">

    <label>Próxima dose</label>
    <input type="date" id="vacinaProxima">
</div>

<!-- MEDICAÇÃO -->
<div class="card hidden" id="medicacaoBox">
    <label>Medicamento</label>
    <input type="text" id="medNome">

    <label>Posologia</label>
    <input type="text" placeholder="Ex: 6 em 6 horas">

    <label>Via</label>
    <select>
        <option>Oral</option>
        <option>IM</option>
        <option>SC</option>
    </select>
</div>

<!-- EXAME -->
<div class="card hidden" id="exameBox">
    <label>Tipo de exame</label>
    <input type="text">

    <label>Urgência</label>
    <select>
        <option>Normal</option>
        <option>Urgente</option>
    </select>

    <label>Observações</label>
    <textarea></textarea>
</div>

<!-- INTERNAÇÃO -->
<div class="card hidden" id="internacaoBox">
    <label>Data início</label>
    <input type="date">

    <label>Data fim</label>
    <input type="date">

    <label>Medicação</label>
    <input type="text">

    <label>Dose</label>
    <input type="text">

    <label>Via</label>
    <select>
        <option>IV</option>
        <option>IM</option>
        <option>Oral</option>
    </select>
</div>

<!-- RETORNO -->
<div class="card">
    <label>Agendar retorno</label>
    <input type="date" id="dataRetorno">
    <input type="time" id="horaRetorno">
</div>

<button class="btn btn-primary" onclick="salvarAtendimento()">
    💾 Salvar Atendimento
</button>

</div>

<script type="module">

import { db } from "../js/firebase-init.js";
import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function carregarAnimais(){
    const snapshot = await getDocs(collection(db, "animais"));
    const select = document.getElementById("animalSelect");

    snapshot.forEach(doc=>{
        const option = document.createElement("option");
        option.value = doc.id;
        option.textContent = doc.data().nome;
        select.appendChild(option);
    });
}

carregarAnimais();

window.salvarAtendimento = async function(){

    const data = {
        animalId: document.getElementById("animalSelect").value,
        tipo: document.getElementById("tipo").value,
        sintomas: document.getElementById("sintomas").value,
        diagnostico: document.getElementById("diagnostico").value,
        procedimentos: document.getElementById("procedimentos").value,
        observacoes: document.getElementById("observacoes").value,
        createdAt: serverTimestamp()
    };

    await addDoc(collection(db, "atendimentos"), data);

    alert("Atendimento salvo!");
}

</script>

<script>

function toggle(id){
    document.getElementById(id).classList.toggle("hidden");
}

lucide.createIcons();

</script>

</body>
</html>
