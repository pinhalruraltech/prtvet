<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atendimentos | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<!-- 🔐 PERMISSÃO -->
<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "atendimentos"
};
</script>

<!-- 🔐 AUTH -->
<script type="module" src="../js/auth-guard.js"></script>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#F5F7F9;
    color:#1F2933;
}

.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-size:18px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

.container{
    padding:16px;
    padding-bottom:80px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 10px rgba(0,0,0,0.04);
}

label{
    font-size:13px;
    color:#6B7280;
    display:block;
    margin-bottom:6px;
}

input, select, textarea{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1.8px solid #CBD5E1;
    font-size:15px;
    margin-bottom:12px;
}

.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.btn-primary{
    background:#2D6A4F;
    color:#fff;
}

.section-title{
    font-weight:600;
    margin-bottom:10px;
    display:flex;
    gap:6px;
}
</style>

</head>

<body style="display:none;">

<div id="menu-container"></div>

<div class="header">
    <i data-lucide="stethoscope"></i>
    Atendimento
</div>

<div class="container">

<div class="card">
    <label>Selecionar Animal</label>
    <select id="animalSelect"></select>
</div>

<div class="card">
    <strong id="animalNome">-</strong>
</div>

<div class="card">

    <div class="section-title">
        <i data-lucide="clipboard"></i> Atendimento
    </div>

    <label>Tipo</label>
    <select id="tipo">
        <option>Consulta</option>
        <option>Vacina</option>
        <option>Procedimento</option>
        <option>Cirurgia</option>
        <option>Emergência</option>
    </select>

    <label>Sintomas</label>
    <textarea id="sintomas"></textarea>

    <label>Diagnóstico</label>
    <textarea id="diagnostico"></textarea>

    <label>Procedimentos</label>
    <textarea id="procedimentos"></textarea>

    <label>Observações</label>
    <textarea id="observacoes"></textarea>

</div>

<button class="btn btn-primary" onclick="salvarAtendimento()">
    <i data-lucide="save"></i> Salvar Atendimento
</button>

</div>

<!-- 🔥 SCRIPT PRINCIPAL -->
<script type="module">

import { db } from "../js/firebase-init.js";
import { carregarClinica } from "../js/clinica-loader.js";

import {
    collection,
    getDocs,
    addDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔐 CONTEXTO */
const uid = localStorage.getItem("uid");
const clinicaId = localStorage.getItem("clinicaId");

if(!uid || !clinicaId){
    window.location.href = "../login.html";
}

/* 🔧 CLÍNICA */
await carregarClinica();

/* 🔥 MENU (PADRÃO CORRETO) */
fetch("../menu/menu.html")
.then(res => res.text())
.then(async html => {

    document.getElementById("menu-container").innerHTML = html;

    const menuModule = await import("../menu/menu.js");

    menuModule.initMenu();
    await menuModule.carregarMenu();

    /* ATIVO */
    document.querySelectorAll(".menu-item").forEach(link=>{
        if(link.getAttribute("data-link") === "atendimentos"){
            link.classList.add("active");
        }
    });

    lucide.createIcons();
    document.body.style.display = "block";

});

/* 🐶 ANIMAIS */
async function carregarAnimais(){

    const q = query(
        collection(db,"animais"),
        where("clinicaId","==",clinicaId)
    );

    const snap = await getDocs(q);

    const select = document.getElementById("animalSelect");

    select.innerHTML = "";

    snap.forEach(doc=>{
        const data = doc.data();

        const option = document.createElement("option");
        option.value = doc.id;
        option.textContent = data.nome;

        select.appendChild(option);
    });

    /* Atualiza nome */
    atualizarNomeAnimal();
}

/* 🔄 NOME DO ANIMAL */
function atualizarNomeAnimal(){
    const select = document.getElementById("animalSelect");
    const nome = select.options[select.selectedIndex]?.text || "-";
    document.getElementById("animalNome").innerText = nome;
}

document.getElementById("animalSelect").addEventListener("change", atualizarNomeAnimal);

carregarAnimais();

/* 💾 SALVAR */
window.salvarAtendimento = async function(){

    const data = {
        clinicaId,
        animalId: document.getElementById("animalSelect").value,
        tipo: document.getElementById("tipo").value,
        sintomas: document.getElementById("sintomas").value,
        diagnostico: document.getElementById("diagnostico").value,
        procedimentos: document.getElementById("procedimentos").value,
        observacoes: document.getElementById("observacoes").value,
        createdAt: serverTimestamp()
    };

    await addDoc(collection(db, "atendimentos"), data);

    alert("Atendimento salvo!");

    /* limpa */
    document.querySelectorAll("textarea").forEach(t=>t.value="");
};

</script>

</body>
</html>
