<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<!-- 🔐 AUTH GUARD -->
<script src="../js/auth-guard.js"></script>

<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "clientes"
};
</script>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter';background:#F5F7F9;}
.header{background:#2D6A4F;color:#fff;padding:16px;font-weight:600;}
.search-box{padding:12px;background:#fff;}
.search-box input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;}
.lista{padding:10px;}
.item{display:flex;gap:10px;background:#fff;padding:12px;border-radius:12px;margin-bottom:10px;cursor:pointer;}
.foto{width:50px;height:50px;border-radius:50%;background:#ddd;}
.sub{font-size:13px;color:#6B7280;}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#2D6A4F;color:#fff;display:flex;align-items:center;justify-content:center;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;}
.modal-content{background:#fff;padding:16px;border-radius:12px;width:90%;max-width:400px;}
</style>

</head>

<body>

<div id="menu-container"></div>

<div class="header">
    <i data-lucide="users"></i> Clientes
</div>

<div class="search-box">
    <input type="text" id="busca" placeholder="Buscar cliente">
</div>

<div class="lista" id="listaClientes"></div>

<div class="fab" id="btnNovoCliente">
    <i data-lucide="plus"></i>
</div>

<!-- MODAL -->
<div class="modal" id="modalCliente">
    <div class="modal-content">
        <h3>Novo Cliente</h3>

        <input type="file" id="foto">
        <input placeholder="Nome" id="nome">
        <input placeholder="Telefone" id="telefone">
        <input placeholder="Cidade" id="cidade">

        <button onclick="salvarCliente()">Salvar</button>
        <button onclick="cancelar()">Cancelar</button>
    </div>
</div>

<!-- MENU LOAD -->
<script>
fetch("../menu/menu.html")
.then(r=>r.text())
.then(html=>{
    document.getElementById("menu-container").innerHTML = html;

    const script = document.createElement("script");
    script.src = "../menu/menu.js";
    document.body.appendChild(script);

    setTimeout(()=>lucide.createIcons(),100);
});
</script>

<!-- FIREBASE -->
<script type="module">

import { db, storage } from "../js/firebase-init.js";

import {
    collection, getDocs, addDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const clinicaId = localStorage.getItem("clinicaId");

let clientes = [];

/* BOTÃO */
document.getElementById("btnNovoCliente").addEventListener("click", ()=>{
    document.getElementById("modalCliente").style.display="flex";
});

/* MODAL */
window.cancelar = ()=> {
    if(confirm("Cancelar?")){
        modalCliente.style.display="none";
    }
};

window.salvarCliente = async ()=>{

    if(!confirm("Salvar cliente?")) return;

    let fotoURL = "";
    const file = foto.files[0];

    if(file){
        const storageRef = ref(storage, "clientes/"+Date.now());
        await uploadBytes(storageRef,file);
        fotoURL = await getDownloadURL(storageRef);
    }

    await addDoc(collection(db,"clientes"),{
        clinicaId,
        nome: nome.value,
        telefone: telefone.value,
        endereco:{cidade:cidade.value},
        foto: fotoURL
    });

    alert("Salvo!");
    modalCliente.style.display="none";
    carregarClientes();
};

/* LISTAR */
async function carregarClientes(){

    const q = query(
        collection(db,"clientes"),
        where("clinicaId","==",clinicaId)
    );

    const snap = await getDocs(q);

    clientes=[];

    snap.forEach(doc=>{
        clientes.push({id:doc.id,...doc.data()});
    });

    render();
}

function render(lista = clientes){

    listaClientes.innerHTML="";

    if(lista.length===0){
        listaClientes.innerHTML="Nenhum cliente";
        return;
    }

    lista.forEach(c=>{

        const div=document.createElement("div");
        div.className="item";

        div.innerHTML=`
            <div class="foto"></div>
            <div>
                <div><strong>${c.nome}</strong></div>
                <div class="sub">${c.telefone||""}</div>
                <div class="sub">${c.endereco?.cidade||""}</div>
            </div>
        `;

        listaClientes.appendChild(div);
    });
}

busca.addEventListener("input", e=>{
    const t=e.target.value.toLowerCase();
    render(clientes.filter(c=>
        c.nome.toLowerCase().includes(t)
    ));
});

carregarClientes();

</script>

<script>lucide.createIcons();</script>

</body>
</html>
