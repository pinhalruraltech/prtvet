<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#F5F7F9;
    color:#1F2933;
}

/* HEADER */
.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-size:18px;
    font-weight:600;
}

/* SEARCH */
.search-box{
    padding:12px 16px;
    background:#fff;
    border-bottom:1px solid #E3E8EE;
}

.search-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1.5px solid #D1D5DB;
    font-size:14px;
}

/* LISTA */
.lista{
    padding:10px;
}

.item{
    display:flex;
    gap:12px;
    align-items:center;
    background:#fff;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    border:1px solid #E3E8EE;
    cursor:pointer;
}

.item:hover{
    background:#F9FAFB;
}

.foto{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ddd;
}

.info{
    flex:1;
}

.nome{
    font-weight:600;
    font-size:15px;
}

.sub{
    font-size:13px;
    color:#6B7280;
}

/* BOTÃO */
.fab{
    position:fixed;
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#2D6A4F;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 6px 12px rgba(0,0,0,0.15);
    cursor:pointer;
}

/* EMPTY */
.empty{
    text-align:center;
    margin-top:40px;
    color:#6B7280;
}

</style>

</head>

<body>

<div class="header">
    <i data-lucide="users"></i> Clientes
</div>

<div class="search-box">
    <input type="text" id="busca" placeholder="Buscar cliente por nome ou telefone">
</div>

<div class="lista" id="listaClientes"></div>

<div class="fab" onclick="novoCliente()">
    <i data-lucide="plus"></i>
</div>

<script type="module">

import { db } from "../js/firebase-init.js";
import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let clientes = [];

async function carregarClientes(){

    const snapshot = await getDocs(collection(db, "clientes"));

    clientes = [];

    snapshot.forEach(doc=>{
        clientes.push({
            id: doc.id,
            ...doc.data()
        });
    });

    renderLista(clientes);
}

function renderLista(lista){

    const container = document.getElementById("listaClientes");
    container.innerHTML = "";

    if(lista.length === 0){
        container.innerHTML = `<div class="empty">Nenhum cliente encontrado</div>`;
        return;
    }

    lista.forEach(cliente=>{

        const div = document.createElement("div");
        div.className = "item";

        div.onclick = () => {
            window.location.href = `cliente.html?id=${cliente.id}`;
        };

        div.innerHTML = `
            <div class="foto"></div>
            <div class="info">
                <div class="nome">${cliente.nome || "-"}</div>
                <div class="sub">${cliente.telefone || ""}</div>
                <div class="sub">${cliente.endereco?.cidade || ""}</div>
            </div>
            <i data-lucide="chevron-right"></i>
        `;

        container.appendChild(div);
    });

    lucide.createIcons();
}

/* BUSCA */
document.getElementById("busca").addEventListener("input", function(){

    const termo = this.value.toLowerCase();

    const filtrado = clientes.filter(c =>
        (c.nome || "").toLowerCase().includes(termo) ||
        (c.telefone || "").includes(termo)
    );

    renderLista(filtrado);
});

/* NOVO CLIENTE */
window.novoCliente = function(){
    window.location.href = "cliente.html";
}

carregarClientes();

</script>

<script>
lucide.createIcons();
</script>

</body>
</html>
