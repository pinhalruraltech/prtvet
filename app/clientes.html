<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "clientes"
};
</script>

<script type="module" src="../js/auth-guard.js"></script>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter';background:#F5F7F9;}

.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

.search-box{padding:12px;background:#fff;}
.search-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #CBD5E1;
}

.lista{padding:10px;}

.item{
    display:flex;
    gap:12px;
    background:#fff;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    border:1px solid #E5E7EB;
    cursor:pointer;
}

.foto{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ddd;
    background-size:cover;
    background-position:center;
}

.sub{font-size:13px;color:#6B7280;}

.fab{
    position:fixed;
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#2D6A4F;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:#fff;
    width:95%;
    max-width:520px;
    max-height:90vh;
    overflow:auto;
    border-radius:16px;
    padding:16px;
}

/* CARDS */
.card{
    background:#fff;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #E5E7EB;
}

label{
    font-size:13px;
    color:#6B7280;
    margin-bottom:4px;
    display:block;
}

input, select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #CBD5E1;
    margin-bottom:10px;
}

/* BOTÕES PADRÃO */
.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-weight:600;
    margin-top:8px;
}

.btn-primary{
    background:#2D6A4F;
    color:#fff;
}

.btn-secondary{
    background:#E5E7EB;
}
</style>

</head>

<body style="display:none;">

<div id="menu-container"></div>

<div class="header">
    <i data-lucide="users"></i>
    Clientes
</div>

<div class="search-box">
    <input id="busca" placeholder="Buscar cliente">
</div>

<div class="lista" id="listaClientes"></div>

<div class="fab" id="btnNovoCliente">
    <i data-lucide="plus"></i>
</div>

<!-- MODAL -->
<div class="modal" id="modalCliente">
<div class="modal-content">

<div class="header" style="border-radius:12px;">
    <i data-lucide="user-plus"></i>
    Cadastro de cliente
</div>

<!-- DADOS BÁSICOS -->
<div class="card">
<label>Tipo de documento</label>
<select id="tipoDoc">
<option value="cpf">CPF</option>
<option value="cnpj">CNPJ</option>
</select>

<label>Documento</label>
<input id="documento">

<label>Nome</label>
<input id="nome">
</div>

<!-- CONTATO -->
<div class="card">
<label>Telefone fixo</label>
<input id="telefoneFixo">

<label>Celular</label>
<input id="telefoneCelular">

<label>Email</label>
<input id="email">
</div>

<!-- ENDEREÇO -->
<div class="card">
<label>CEP</label>
<input id="cep">

<label>Logradouro</label>
<input id="logradouro">

<label>Número</label>
<input id="numero">

<label>Bairro</label>
<input id="bairro">

<label>Cidade</label>
<input id="cidade">

<label>Estado</label>
<input id="estado">
</div>

<!-- FOTO -->
<div class="card">
<label>Foto</label>
<input type="file" id="foto">
</div>

<button class="btn btn-primary" onclick="salvarCliente()">
    <i data-lucide="save"></i> Salvar Cliente
</button>

<button class="btn btn-secondary" onclick="modalCliente.style.display='none'">
Cancelar
</button>

</div>
</div>

<script type="module">

import { db, storage } from "../js/firebase-init.js";
import { carregarClinica } from "../js/clinica-loader.js";

import {
collection,getDocs,addDoc,query,where,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const uid = localStorage.getItem("uid");
const clinicaId = localStorage.getItem("clinicaId");

if(!uid || !clinicaId){
    window.location.href="../login.html";
}

await carregarClinica();

/* MENU */
fetch("../menu/menu.html")
.then(r=>r.text())
.then(async html=>{
document.getElementById("menu-container").innerHTML=html;

const m = await import("../menu/menu.js");
m.initMenu();
await m.carregarMenu();

document.querySelector('[data-link="clientes"]').classList.add("active");

lucide.createIcons();
document.body.style.display="block";
});

/* MODAL */
btnNovoCliente.onclick=()=>modalCliente.style.display="flex";

/* MÁSCARAS */
document.getElementById("documento").addEventListener("input",()=>{
let v=documento.value.replace(/\D/g,'');

if(tipoDoc.value==="cpf"){
v=v.replace(/(\d{3})(\d)/,"$1.$2");
v=v.replace(/(\d{3})(\d)/,"$1.$2");
v=v.replace(/(\d{3})(\d{1,2})$/,"$1-$2");
}else{
v=v.replace(/^(\d{2})(\d)/,"$1.$2");
v=v.replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3");
v=v.replace(/\.(\d{3})(\d)/,".$1/$2");
v=v.replace(/(\d{4})(\d)/,"$1-$2");
}
documento.value=v;
});

telefoneFixo.addEventListener("input",()=>{
let v=telefoneFixo.value.replace(/\D/g,'');
v=v.replace(/(\d{2})(\d)/,"($1)$2");
v=v.replace(/(\d{4})(\d)/,"$1-$2");
telefoneFixo.value=v;
});

telefoneCelular.addEventListener("input",()=>{
let v=telefoneCelular.value.replace(/\D/g,'');
v=v.replace(/(\d{2})(\d)/,"($1)$2");
v=v.replace(/(\d{5})(\d)/,"$1-$2");
telefoneCelular.value=v;
});

/* DADOS */
let clientes=[];

/* SALVAR */
window.salvarCliente=async()=>{

let fotoURL="";
const file=foto.files[0];

if(file){
const storageRef=ref(storage,"clientes/"+Date.now());
await uploadBytes(storageRef,file);
fotoURL=await getDownloadURL(storageRef);
}

await addDoc(collection(db,"clientes"),{
clinicaId,
nome:nome.value,
documento:documento.value,
telefoneFixo:telefoneFixo.value,
telefoneCelular:telefoneCelular.value,
email:email.value,
createdAt:serverTimestamp(),
endereco:{
logradouro:logradouro.value,
numero:numero.value,
bairro:bairro.value,
cidade:cidade.value,
estado:estado.value,
cep:cep.value
},
foto:fotoURL
});

modalCliente.style.display="none";
carregarClientes();
};

/* LISTAR */
async function carregarClientes(){

const q=query(collection(db,"clientes"),where("clinicaId","==",clinicaId));
const snap=await getDocs(q);

clientes=[];
snap.forEach(doc=>clientes.push({id:doc.id,...doc.data()}));

render();

}

/* RENDER */
function render(lista=clientes){

listaClientes.innerHTML="";

lista.forEach(c=>{

const div=document.createElement("div");
div.className="item";

div.onclick=()=>{
window.location.href=`cliente.html?id=${c.id}`;
};

div.innerHTML=`
<div class="foto" style="background-image:url('${c.foto||""}')"></div>
<div>
<strong>${(c.nome||"").toUpperCase()}</strong>
<div class="sub">${c.documento||"-"}</div>
<div class="sub">${c.endereco?.cidade||""} - ${c.endereco?.estado||""}</div>
</div>
`;

listaClientes.appendChild(div);

});

}

/* BUSCA */
busca.addEventListener("input",e=>{
const t=e.target.value.toLowerCase();

render(clientes.filter(c=>
(c.nome||"").toLowerCase().includes(t) ||
(c.documento||"").includes(t) ||
(c.endereco?.cidade||"").toLowerCase().includes(t) ||
(c.endereco?.estado||"").toLowerCase().includes(t)
));
});

carregarClientes();

</script>

</body>
</html>
