<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<style>

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#F5F7F9;
    color:#1F2933;
}

/* HEADER */
.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-size:18px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

/* SEARCH */
.search-box{
    padding:12px 16px;
    background:#fff;
    border-bottom:1px solid #E3E8EE;
}

.search-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1.5px solid #D1D5DB;
    font-size:14px;
}

/* LISTA */
.lista{
    padding:10px;
}

.item{
    display:flex;
    gap:12px;
    align-items:center;
    background:#fff;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    border:1px solid #E3E8EE;
    cursor:pointer;
}

.foto{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ddd;
}

.info{flex:1;}

.nome{font-weight:600;}
.sub{font-size:13px;color:#6B7280;}

.fab{
    position:fixed;
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#2D6A4F;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* MODAL */
.modal{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
}

.modal-content{
    background:#fff;
    width:100%;
    max-width:400px;
    border-radius:12px;
    padding:16px;
}

.hidden{display:none;}

</style>

</head>

<body>

<div id="menu-container"></div>

<div class="header">
    <i data-lucide="users"></i>
    Clientes
</div>

<div class="search-box">
    <input type="text" id="busca" placeholder="Buscar cliente por nome ou telefone">
</div>

<div class="lista" id="listaClientes"></div>

<div class="fab" onclick="abrirModal()">
    <i data-lucide="plus"></i>
</div>

<!-- MODAL -->
<div class="modal" id="modalCliente">
    <div class="modal-content">

        <h3>Novo Cliente</h3>

        <input type="file" id="foto">

        <input placeholder="Nome" id="nome">
        <input placeholder="Telefone" id="telefone">
        <input placeholder="Cidade" id="cidade">

        <button onclick="salvarCliente()">Salvar</button>
        <button onclick="cancelar()">Cancelar</button>

    </div>
</div>

<div style="text-align:center;padding:24px 16px;font-size:12px;color:#6B7280;">
Versão 1.0.0 • Desenvolvido por PRT Soluções
</div>

<script>
fetch("../menu/menu.html")
.then(res => res.text())
.then(data => {
    document.getElementById("menu-container").innerHTML = data;

    const script = document.createElement("script");
    script.src = "../menu/menu.js";
    document.body.appendChild(script);

    setTimeout(()=>{
        if(typeof initMenu === "function"){
            initMenu();
        }
        lucide.createIcons();
    },100);
});
</script>

<script type="module">

import { db } from "../js/firebase-init.js";
import {
    collection,
    getDocs,
    addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const storage = getStorage();

let clientes = [];

async function carregarClientes(){

    console.log("Carregando clientes...");

    const snapshot = await getDocs(collection(db, "clientes"));

    clientes = [];

    snapshot.forEach(doc=>{
        console.log(doc.data()); // 🔍 DEBUG
        clientes.push({
            id: doc.id,
            ...doc.data()
        });
    });

    renderLista(clientes);
}

function renderLista(lista){

    const container = document.getElementById("listaClientes");
    container.innerHTML = "";

    if(lista.length === 0){
        container.innerHTML = `<div>Nenhum cliente encontrado</div>`;
        return;
    }

    lista.forEach(cliente=>{

        const div = document.createElement("div");
        div.className = "item";

        div.onclick = () => {
            window.location.href = `cliente.html?id=${cliente.id}`;
        };

        div.innerHTML = `
            <div class="foto"></div>
            <div class="info">
                <div class="nome">${cliente.nome || "-"}</div>
                <div class="sub">${cliente.telefone || ""}</div>
                <div class="sub">${cliente.endereco?.cidade || ""}</div>
            </div>
        `;

        container.appendChild(div);
    });
}

/* MODAL */
window.abrirModal = ()=>{
    document.getElementById("modalCliente").style.display = "flex";
}

window.cancelar = ()=>{
    if(confirm("Cancelar cadastro?")){
        document.getElementById("modalCliente").style.display = "none";
    }
}

/* SALVAR */
window.salvarCliente = async ()=>{

    if(!confirm("Salvar cliente?")) return;

    const file = document.getElementById("foto").files[0];
    let fotoURL = "";

    if(file){
        const storageRef = ref(storage, "clientes/" + Date.now());
        await uploadBytes(storageRef, file);
        fotoURL = await getDownloadURL(storageRef);
    }

    await addDoc(collection(db,"clientes"),{
        nome: document.getElementById("nome").value,
        telefone: document.getElementById("telefone").value,
        endereco:{
            cidade: document.getElementById("cidade").value
        },
        foto: fotoURL
    });

    alert("Cliente salvo!");

    document.getElementById("modalCliente").style.display = "none";

    carregarClientes();
}

carregarClientes();

</script>

<script>
lucide.createIcons();
</script>

</body>
</html>
