<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../menu/menu.css">

<script src="../js/auth-guard.js"></script>

<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "clientes"
};
</script>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter';background:#F5F7F9;}

.header{background:#2D6A4F;color:#fff;padding:16px;font-weight:600;}

.search-box{padding:12px;background:#fff;}
.search-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #CBD5E1;
}

.lista{padding:10px;}

.item{
    display:flex;
    gap:10px;
    background:#fff;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    border:1px solid #E5E7EB;
}

.foto{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ddd;
    background-size:cover;
    background-position:center;
}

.sub{font-size:13px;color:#6B7280;}

.fab{
    position:fixed;
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#2D6A4F;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

/* MODAL */
.modal{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:#fff;
    padding:20px;
    border-radius:14px;
    width:95%;
    max-width:520px;
}

.modal-header{
    margin-bottom:16px;
}

.modal-header h3{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-group label{
    font-size:13px;
    color:#6B7280;
    margin-bottom:4px;
}

.form-group input{
    padding:10px;
    border-radius:10px;
    border:1px solid #CBD5E1;
}

.modal-actions{
    margin-top:16px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.btn{
    padding:10px 14px;
    border-radius:10px;
    border:1px solid #ccc;
    background:#fff;
    cursor:pointer;
}

.btn.primary{
    background:#2D6A4F;
    color:#fff;
    border:none;
}
</style>

</head>

<body>

<div id="menu-container"></div>

<div class="header">
    <i data-lucide="users"></i> Clientes
</div>

<div class="search-box">
    <input type="text" id="busca" placeholder="Buscar cliente">
</div>

<div class="lista" id="listaClientes"></div>

<div class="fab" id="btnNovoCliente">
    <i data-lucide="plus"></i>
</div>

<!-- MODAL -->
<div class="modal" id="modalCliente">
    <div class="modal-content">

        <div class="modal-header">
            <h3>
                <i data-lucide="user-plus"></i>
                Cadastro de novo cliente
            </h3>
        </div>

        <div class="form-grid">

            <div class="form-group full">
                <label>Foto</label>
                <input type="file" id="foto">
            </div>

            <div class="form-group">
                <label>Nome</label>
                <input id="nome">
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input id="telefone">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input id="email">
            </div>

            <div class="form-group">
                <label>CPF</label>
                <input id="cpf">
            </div>

            <div class="form-group full">
                <label>Logradouro</label>
                <input id="logradouro">
            </div>

            <div class="form-group">
                <label>Número</label>
                <input id="numero">
            </div>

            <div class="form-group">
                <label>Bairro</label>
                <input id="bairro">
            </div>

            <div class="form-group">
                <label>Cidade</label>
                <input id="cidade">
            </div>

            <div class="form-group">
                <label>Estado</label>
                <input id="estado">
            </div>

            <div class="form-group">
                <label>CEP</label>
                <input id="cep">
            </div>

        </div>

        <div class="modal-actions">
            <button class="btn primary" onclick="salvarCliente()">Salvar</button>
            <button class="btn" onclick="cancelar()">Cancelar</button>
        </div>

    </div>
</div>

<!-- MENU -->
<script>
fetch("../menu/menu.html")
.then(r=>r.text())
.then(html=>{
    document.getElementById("menu-container").innerHTML = html;

    const script = document.createElement("script");
    script.src = "../menu/menu.js";
    document.body.appendChild(script);

    setTimeout(()=>lucide.createIcons(),100);
});
</script>

<!-- FIREBASE -->
<script type="module">

import { db, storage } from "../js/firebase-init.js";

import {
    collection, getDocs, addDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const clinicaId = localStorage.getItem("clinicaId");

let clientes = [];

document.getElementById("btnNovoCliente").addEventListener("click", ()=>{
    modalCliente.style.display="flex";
});

window.cancelar = ()=>{
    modalCliente.style.display="none";
};

window.salvarCliente = async ()=>{

    if(!clinicaId){
        alert("Erro: clínica não identificada");
        return;
    }

    let fotoURL = "";
    const file = foto.files[0];

    if(file){
        const storageRef = ref(storage, "clientes/"+Date.now());
        await uploadBytes(storageRef,file);
        fotoURL = await getDownloadURL(storageRef);
    }

    await addDoc(collection(db,"clientes"),{

        clinicaId,
        nome: nome.value,
        telefone: telefone.value,
        email: email.value,
        cpf: cpf.value,
        situacao: "ativo",
        codigo: "CLI-" + Date.now(),
        createdAt: new Date(),

        endereco:{
            logradouro: logradouro.value,
            numero: numero.value,
            bairro: bairro.value,
            cidade: cidade.value,
            estado: estado.value,
            cep: cep.value
        },

        animais: [],
        foto: fotoURL

    });

    alert("Cliente cadastrado!");
    modalCliente.style.display="none";
    carregarClientes();
};

async function carregarClientes(){

    const q = query(
        collection(db,"clientes"),
        where("clinicaId","==",clinicaId)
    );

    const snap = await getDocs(q);

    clientes=[];

    snap.forEach(doc=>{
        clientes.push({id:doc.id,...doc.data()});
    });

    render();
}

function render(lista = clientes){

    listaClientes.innerHTML="";

    if(lista.length===0){
        listaClientes.innerHTML="Nenhum cliente";
        return;
    }

    lista.forEach(c=>{

        const div=document.createElement("div");
        div.className="item";

        div.innerHTML=`
            <div class="foto" style="background-image:url('${c.foto||""}')"></div>
            <div>
                <div><strong>${c.nome}</strong></div>
                <div class="sub">${c.telefone||""}</div>
                <div class="sub">${c.endereco?.cidade||""}</div>
            </div>
        `;

        listaClientes.appendChild(div);
    });
}

busca.addEventListener("input", e=>{
    const t=e.target.value.toLowerCase();
    render(clientes.filter(c=>
        c.nome.toLowerCase().includes(t)
    ));
});

carregarClientes();

</script>

<script>lucide.createIcons();</script>

</body>
</html>
