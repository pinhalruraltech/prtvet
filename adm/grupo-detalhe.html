<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo | ADM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{box-sizing:border-box;}

body{
    font-family:Inter;
    background:#F5F7F9;
    margin:0;
    display:none;
}

.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

.container{
    padding:16px;
    max-width:600px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    border:1px solid #E5E7EB;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #CBD5E1;
    margin-bottom:10px;
}

.section-title{
    font-weight:600;
    margin-bottom:10px;
}

.check{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
}

.check input{
    width:18px;
    height:18px;
    margin:0;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2D6A4F;
    color:#fff;
    font-weight:600;
    margin-bottom:10px;
    cursor:pointer;
}

.btn-sec{
    background:#6B7280;
}
</style>

</head>

<body>

<div id="menu-adm"></div>

<div class="header">
<i data-lucide="users"></i>
Grupo
</div>

<div class="container">

<!-- IDENTIDADE -->
<div class="card">
<input id="id" placeholder="ID (ex: recepcao)">
<input id="nome" placeholder="Nome do grupo">
</div>

<!-- APP -->
<div class="card">
<div class="section-title">Permissões APP</div>

<label class="check"><input type="checkbox" id="inicio"> Início</label>
<label class="check"><input type="checkbox" id="clientes"> Clientes</label>
<label class="check"><input type="checkbox" id="animais"> Animais</label>
<label class="check"><input type="checkbox" id="atendimentos"> Atendimentos</label>
<label class="check"><input type="checkbox" id="vacinas"> Vacinas</label>
<label class="check"><input type="checkbox" id="internacao"> Internação</label>
<label class="check"><input type="checkbox" id="agenda"> Agenda</label>
<label class="check"><input type="checkbox" id="estoque"> Estoque</label>
<label class="check"><input type="checkbox" id="vendas"> Vendas</label>
<label class="check"><input type="checkbox" id="financeiro"> Financeiro</label>
<label class="check"><input type="checkbox" id="relatorios"> Relatórios</label>
<label class="check"><input type="checkbox" id="documentos"> Documentos</label>
<label class="check"><input type="checkbox" id="config"> Config</label>
</div>

<!-- ADM -->
<div class="card">
<div class="section-title">Permissões ADM</div>

<label class="check"><input type="checkbox" id="adm_clinicas"> Clínicas</label>
<label class="check"><input type="checkbox" id="adm_usuarios"> Usuários</label>
<label class="check"><input type="checkbox" id="adm_grupos"> Grupos</label>
</div>

<button class="btn" onclick="salvar()">Salvar</button>
<button class="btn btn-sec" onclick="voltar()">Voltar</button>

</div>

<script type="module">

import { db } from "../js/firebase-init.js";

import {
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth = getAuth();

const params = new URLSearchParams(window.location.search);
const idParam = params.get("id");

let lista = [];

/* 🔐 AUTH + PERMISSÃO */
onAuthStateChanged(auth, async (user)=>{

    if(!user){
        window.location.href="../index.html";
        return;
    }

    try{

        const userSnap = await getDoc(doc(db,"usuarios",user.uid));

        if(!userSnap.exists()) return;

        const usuario = userSnap.data();

        if(!usuario.ativo){
            alert("Usuário inativo");
            return;
        }

        const gruposSnap = await getDoc(doc(db,"config","grupos"));
        const grupos = gruposSnap.data().lista;

        const grupoUser = grupos.find(g => g.id === usuario.grupo);

        if(!grupoUser?.permissoes?.adm?.grupos){
            alert("Sem permissão");
            window.location.href="../index.html";
            return;
        }

        /* MENU */
        fetch("menu-adm.html")
        .then(r=>r.text())
        .then(html=>{
            document.getElementById("menu-adm").innerHTML = html;
            lucide.createIcons();
        });

        document.body.style.display="block";

        carregar();

    }catch(e){
        alert("Erro: " + e.message);
    }

});

/* LOAD */
async function carregar(){

    const ref = doc(db,"config","grupos");
    const snap = await getDoc(ref);

    if(!snap.exists()) return;

    lista = snap.data().lista || [];

    if(idParam){

        const g = lista.find(x=>x.id === idParam);
        if(!g) return;

        id.value = g.id;
        nome.value = g.nome;

        const p = g.permissoes || {};

        inicio.checked = p.app?.inicio || false;
        clientes.checked = p.app?.clientes || false;
        animais.checked = p.app?.animais || false;
        atendimentos.checked = p.app?.atendimentos || false;
        vacinas.checked = p.app?.vacinas || false;
        internacao.checked = p.app?.internacao || false;
        agenda.checked = p.app?.agenda || false;
        estoque.checked = p.app?.estoque || false;
        vendas.checked = p.app?.vendas || false;
        financeiro.checked = p.app?.financeiro || false;
        relatorios.checked = p.app?.relatorios || false;
        documentos.checked = p.app?.documentos || false;
        config.checked = p.app?.config || false;

        adm_clinicas.checked = p.adm?.clinicas || false;
        adm_usuarios.checked = p.adm?.usuarios || false;
        adm_grupos.checked = p.adm?.grupos || false;
    }
}

/* SAVE */
window.salvar = async ()=>{

    const novo = {
        id: id.value.trim(),
        nome: nome.value.trim(),
        sistema:false,
        permissoes:{
            app:{
                inicio: inicio.checked,
                clientes: clientes.checked,
                animais: animais.checked,
                atendimentos: atendimentos.checked,
                vacinas: vacinas.checked,
                internacao: internacao.checked,
                agenda: agenda.checked,
                estoque: estoque.checked,
                vendas: vendas.checked,
                financeiro: financeiro.checked,
                relatorios: relatorios.checked,
                documentos: documentos.checked,
                config: config.checked
            },
            adm:{
                clinicas: adm_clinicas.checked,
                usuarios: adm_usuarios.checked,
                grupos: adm_grupos.checked
            }
        }
    };

    const index = lista.findIndex(g=>g.id === novo.id);

    if(index >= 0){
        lista[index] = novo;
    }else{
        lista.push(novo);
    }

    await setDoc(doc(db,"config","grupos"),{
        lista
    });

    alert("Grupo salvo!");
    window.location.href="grupos.html";
};

/* VOLTAR */
window.voltar = ()=>{
    window.location.href="grupos.html";
};

lucide.createIcons();

</script>

</body>
</html>
