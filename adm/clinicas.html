<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clínicas | ADM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body{
    font-family:Inter;
    background:#F5F7F9;
    margin:0;
    color:#1F2933;
    display:none;
}

/* HEADER */
.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

/* CONTAINER */
.container{
    padding:16px;
    max-width:600px;
    margin:auto;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    border:1px solid #E5E7EB;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
}

.card:hover{
    background:#f9fafb;
}

.nome{
    font-weight:600;
    font-size:15px;
}

.sub{
    font-size:12px;
    color:#6B7280;
    margin-top:4px;
}

/* FAB */
.fab{
    position:fixed;
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#2D6A4F;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

/* EMPTY */
.empty{
    text-align:center;
    padding:30px;
    color:#6B7280;
}
</style>

</head>

<body>

<div id="menu-adm"></div>

<div class="header">
    <i data-lucide="building"></i>
    Clínicas
</div>

<div class="container" id="lista"></div>

<div class="fab" onclick="novaClinica()">
    <i data-lucide="plus"></i>
</div>

<script type="module">

import { db } from "../js/firebase-init.js";

import {
    collection, getDocs, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth = getAuth();
const lista = document.getElementById("lista");

/* 🔐 AUTH GUARD COMPLETO */
onAuthStateChanged(auth, async (user)=>{

    if(!user){
        window.location.href = "../index.html";
        return;
    }

    try{

        /* 🔎 BUSCAR USUÁRIO */
        const userRef = doc(db,"usuarios",user.uid);
        const userSnap = await getDoc(userRef);

        if(!userSnap.exists()){
            alert("Usuário não encontrado");
            window.location.href = "../index.html";
            return;
        }

        const usuario = userSnap.data();

        if(usuario.ativo === false){
            alert("Usuário inativo");
            window.location.href = "../index.html";
            return;
        }

        /* 🔎 BUSCAR CLÍNICA */
        const clinicaRef = doc(db,"clinicas",usuario.clinicaId);
        const clinicaSnap = await getDoc(clinicaRef);

        if(!clinicaSnap.exists()){
            alert("Clínica não encontrada");
            return;
        }

        const clinica = clinicaSnap.data();

        /* 🔎 BUSCAR GRUPOS */
        const gruposSnap = await getDoc(doc(db,"config","grupos"));

        if(!gruposSnap.exists()){
            alert("Configuração de grupos não encontrada");
            return;
        }

        const grupos = gruposSnap.data().lista || [];

        const grupo = grupos.find(g => g.id === usuario.grupo);

        if(!grupo){
            alert("Grupo do usuário não encontrado");
            return;
        }

        /* 🔐 VALIDA PERMISSÃO ADM */
        const temPermissao = grupo.permissoes?.adm?.clinicas === true;

        if(!temPermissao){
            alert("Acesso negado");
            window.location.href = "../index.html";
            return;
        }

        /* 💾 SALVA CONTEXTO */
        localStorage.setItem("uid", user.uid);
        localStorage.setItem("clinicaId", usuario.clinicaId);
        localStorage.setItem("grupo", usuario.grupo);

        /* 📦 CARREGA MENU */
        fetch("menu-adm.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("menu-adm").innerHTML = html;
            lucide.createIcons();
        });

        /* 🚀 LIBERA TELA */
        document.body.style.display = "block";

        /* 📥 CARREGA DADOS */
        carregar();

    }catch(e){
        alert("Erro: " + e.message);
    }

});

/* 📥 LISTA CLÍNICAS */
async function carregar(){

    const snap = await getDocs(collection(db,"clinicas"));

    lista.innerHTML = "";

    if(snap.empty){
        lista.innerHTML = `<div class="empty">Nenhuma clínica cadastrada</div>`;
        return;
    }

    snap.forEach(docItem=>{

        const c = docItem.data();

        const div = document.createElement("div");
        div.className="card";

        div.innerHTML = `
            <div>
                <div class="nome">${c.nome || "Sem nome"}</div>
                <div class="sub">${docItem.id}</div>
            </div>

            <i data-lucide="chevron-right"></i>
        `;

        div.onclick = ()=>{
            window.location.href = "clinica-detalhe.html?id=" + docItem.id;
        };

        lista.appendChild(div);
    });

    lucide.createIcons();
}

/* ➕ NOVA */
window.novaClinica = ()=>{
    window.location.href = "clinica-detalhe.html";
};

</script>

</body>
</html>
