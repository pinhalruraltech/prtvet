<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clínicas | ADM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body{
    font-family:Inter;
    background:#F5F7F9;
    margin:0;
    color:#1F2933;
}

/* HEADER PADRÃO (IGUAL LOGIN) */
.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

/* CONTAINER PADRÃO */
.container{
    padding:16px;
    max-width:600px;
    margin:auto;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    border:1px solid #E5E7EB;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    background:#f9fafb;
}

/* TEXTO */
.nome{
    font-weight:600;
    font-size:15px;
}

.sub{
    font-size:12px;
    color:#6B7280;
    margin-top:4px;
}

/* FAB */
.fab{
    position:fixed;
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#2D6A4F;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

/* EMPTY */
.empty{
    text-align:center;
    padding:30px;
    color:#6B7280;
}
</style>

</head>

<body>

<!-- FUTURO MENU ADM -->
<div id="menu-adm"></div>

<div class="header">
    <i data-lucide="building"></i>
    Clínicas
</div>

<div class="container" id="lista"></div>

<div class="fab" onclick="novaClinica()">
    <i data-lucide="plus"></i>
</div>

<script type="module">

import { db } from "../js/firebase-init.js";
import {
    collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔐 PROTEÇÃO */
const papel = localStorage.getItem("papel");
if(papel !== "adm"){
    window.location.href = "../index.html";
}

const lista = document.getElementById("lista");

/* 📥 CARREGAR */
async function carregar(){

    const snap = await getDocs(collection(db,"clinicas"));

    lista.innerHTML = "";

    if(snap.empty){
        lista.innerHTML = `<div class="empty">Nenhuma clínica cadastrada</div>`;
        return;
    }

    snap.forEach(doc=>{

        const c = doc.data();

        const div = document.createElement("div");
        div.className="card";

        div.innerHTML = `
            <div>
                <div class="nome">${c.nome || "Sem nome"}</div>
                <div class="sub">${doc.id}</div>
            </div>

            <i data-lucide="chevron-right"></i>
        `;

        div.onclick = ()=>{
            window.location.href = "clinica-detalhe.html?id=" + doc.id;
        };

        lista.appendChild(div);
    });

    lucide.createIcons();
}

/* ➕ NOVA */
window.novaClinica = ()=>{
    window.location.href = "clinica-detalhe.html";
};

carregar();

</script>

</body>
</html>
