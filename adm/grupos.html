<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupos | ADM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{box-sizing:border-box;}

body{
    font-family:Inter;
    background:#F5F7F9;
    margin:0;
    display:none;
}

.header{
    background:#2D6A4F;
    color:#fff;
    padding:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

.container{
    padding:16px;
    max-width:600px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    border:1px solid #E5E7EB;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    background:#f9fafb;
}

.badge{
    font-size:11px;
    padding:4px 8px;
    border-radius:8px;
    background:#E5E7EB;
}

.fab{
    position:fixed;
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#2D6A4F;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}
</style>

</head>

<body>

<div id="menu-adm"></div>

<div class="header">
<i data-lucide="users"></i>
Grupos
</div>

<div class="container" id="lista"></div>

<div class="fab" onclick="novoGrupo()">
<i data-lucide="plus"></i>
</div>

<script type="module">

import { db } from "../js/firebase-init.js";

import {
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth = getAuth();

const lista = document.getElementById("lista");

/* 🔐 AUTH + PERMISSÃO */
onAuthStateChanged(auth, async (user)=>{

    if(!user){
        window.location.href="../index.html";
        return;
    }

    try{

        const userSnap = await getDoc(doc(db,"usuarios",user.uid));

        if(!userSnap.exists()) return;

        const usuario = userSnap.data();

        if(!usuario.ativo){
            alert("Usuário inativo");
            return;
        }

        const gruposSnap = await getDoc(doc(db,"config","grupos"));
        const grupos = gruposSnap.data().lista;

        const grupoUser = grupos.find(g => g.id === usuario.grupo);

        if(!grupoUser?.permissoes?.adm?.grupos){
            alert("Sem permissão");
            window.location.href="../index.html";
            return;
        }

        /* MENU */
        fetch("menu-adm.html")
        .then(r=>r.text())
        .then(html=>{
            document.getElementById("menu-adm").innerHTML = html;
            lucide.createIcons();
        });

        document.body.style.display="block";

        carregar();

    }catch(e){
        alert("Erro: " + e.message);
    }

});

/* LOAD */
async function carregar(){

    const ref = doc(db,"config","grupos");
    const snap = await getDoc(ref);

    lista.innerHTML="";

    if(!snap.exists()){
        lista.innerHTML = `<div style="text-align:center;color:#6B7280;">Nenhum grupo cadastrado</div>`;
        return;
    }

    const grupos = snap.data().lista || [];

    grupos.forEach(g=>{

        const div = document.createElement("div");
        div.className="card";

        div.innerHTML=`
            <div>
                <strong>${g.nome}</strong><br>
                <small>${g.id}</small>
            </div>

            <div>
                ${g.sistema ? '<span class="badge">Sistema</span>' : ''}
                <i data-lucide="chevron-right"></i>
            </div>
        `;

        div.onclick = ()=>{
            window.location.href="grupo-detalhe.html?id="+g.id;
        };

        lista.appendChild(div);
    });

    lucide.createIcons();
}

/* NOVO */
window.novoGrupo = ()=>{
    window.location.href="grupo-detalhe.html";
};

</script>

</body>
</html>
