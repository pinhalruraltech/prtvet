<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | APPVET</title>

<!-- CONTROLE DE PERMISSÃO -->
<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "dashboard"
};
</script>

<style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

/* BODY */
body {
    background: #F5F7F9;
    display: none;
}

/* LAYOUT */
.container {
    display: flex;
    min-height: 100vh;
}

/* CONTEÚDO */
.main {
    flex: 1;
    padding: 20px;
}

/* HEADER */
.topbar {
    background: #FFFFFF;
    padding: 15px 20px;
    border: 1px solid #E3E8EE;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: 600;
    color: #1F2933;
}

/* GRID CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

/* CARD */
.card {
    background: #FFFFFF;
    border: 1px solid #E3E8EE;
    border-radius: 10px;
    padding: 20px;
}

.card-title {
    font-size: 14px;
    color: #6B7280;
    margin-bottom: 10px;
}

.card-value {
    font-size: 22px;
    font-weight: 600;
    color: #1F2933;
}

/* SEÇÕES */
.section {
    margin-top: 20px;
    background: #FFFFFF;
    border: 1px solid #E3E8EE;
    border-radius: 10px;
    padding: 20px;
}

.section-title {
    font-weight: 600;
    margin-bottom: 15px;
    color: #1F2933;
}

/* LISTA */
.list-item {
    padding: 10px;
    border-bottom: 1px solid #E3E8EE;
    font-size: 14px;
    color: #374151;
}

.list-item:last-child {
    border-bottom: none;
}

/* RODAPÉ */
.footer {
    margin-top: 30px;
    padding: 15px;
    text-align: center;
    font-size: 13px;
    color: #6B7280;
}
</style>
</head>

<body>

<div class="container">

    <!-- MENU -->
    <div id="menu-container"></div>

    <!-- CONTEÚDO -->
    <div class="main">

        <div class="topbar">
            Dashboard
        </div>

        <!-- CARDS -->
        <div class="cards">
            <div class="card">
                <div class="card-title">Atendimentos Hoje</div>
                <div class="card-value">12</div>
            </div>

            <div class="card">
                <div class="card-title">Animais Cadastrados</div>
                <div class="card-value">248</div>
            </div>

            <div class="card">
                <div class="card-title">Clientes</div>
                <div class="card-value">132</div>
            </div>

            <div class="card">
                <div class="card-title">Vacinas Pendentes</div>
                <div class="card-value">9</div>
            </div>
        </div>

        <!-- AGENDA -->
        <div class="section">
            <div class="section-title">Agenda de Hoje</div>

            <div class="list-item">09:00 - Consulta | Rex</div>
            <div class="list-item">10:30 - Vacinação | Mia</div>
            <div class="list-item">14:00 - Cirurgia | Thor</div>
        </div>

        <!-- ALERTAS -->
        <div class="section">
            <div class="section-title">Alertas</div>

            <div class="list-item">Estoque baixo: Antibiótico X</div>
            <div class="list-item">Vacina atrasada: Bella</div>
        </div>

        <!-- RODAPÉ -->
        <div class="footer">
            © 2026 APPVET • Sistema de Gestão Veterinária
        </div>

    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<script src="./js/firebase-init.js"></script>
<script src="./js/auth.js"></script>

<!-- LOAD MENU -->
<script>
fetch('./menu/menu.html')
.then(res => res.text())
.then(data => {
    document.getElementById('menu-container').innerHTML = data;

    // MARCAR ATIVO
    const links = document.querySelectorAll('.menu a');
    links.forEach(link => {
        if (link.getAttribute('href') === 'dashboard.html') {
            link.classList.add('active');
        }
    });

    // INJETAR PERMISSÕES
    const script = document.createElement('script');
    script.src = './js/menu-permissoes.js';

    script.onload = () => {
        document.body.style.display = "block";
    };

    document.body.appendChild(script);
});
</script>

</body>
</html>
