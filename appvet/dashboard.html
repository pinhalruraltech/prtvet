<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | APPVET</title>

<!-- PERMISSÃO -->
<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "dashboard"
};
</script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #F5F7F9;
    display: none;
}

.container {
    display: flex;
    min-height: 100vh;
}

.main {
    flex: 1;
    padding: 20px;
}

.topbar {
    background: #FFFFFF;
    padding: 15px 20px;
    border: 1px solid #E3E8EE;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: 600;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

.card {
    background: #FFFFFF;
    border: 1px solid #E3E8EE;
    border-radius: 10px;
    padding: 20px;
}

.card-title {
    font-size: 14px;
    color: #6B7280;
}

.card-value {
    font-size: 22px;
    font-weight: 600;
    margin-top: 8px;
}

.section {
    margin-top: 20px;
    background: #FFFFFF;
    border: 1px solid #E3E8EE;
    border-radius: 10px;
    padding: 20px;
}

.section-title {
    font-weight: 600;
    margin-bottom: 10px;
}

.list-item {
    padding: 10px 0;
    border-bottom: 1px solid #E3E8EE;
}

.footer {
    margin-top: 30px;
    text-align: center;
    font-size: 13px;
    color: #6B7280;
}
</style>
</head>

<body>

<div class="container">

    <div id="menu-container"></div>

    <div class="main">

        <div class="topbar">Dashboard</div>

        <div class="cards">
            <div class="card">
                <div class="card-title">Atendimentos Hoje</div>
                <div class="card-value">12</div>
            </div>

            <div class="card">
                <div class="card-title">Animais</div>
                <div class="card-value">248</div>
            </div>

            <div class="card">
                <div class="card-title">Clientes</div>
                <div class="card-value">132</div>
            </div>

            <div class="card">
                <div class="card-title">Vacinas Pendentes</div>
                <div class="card-value">9</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Agenda de Hoje</div>
            <div class="list-item">09:00 - Consulta | Rex</div>
            <div class="list-item">10:30 - Vacina | Mia</div>
        </div>

        <div class="section">
            <div class="section-title">Alertas</div>
            <div class="list-item">Estoque baixo</div>
            <div class="list-item">Vacina atrasada</div>
        </div>

        <div class="footer">
            © 2026 APPVET • Sistema de Gestão Veterinária
        </div>

    </div>
</div>

<!-- FIREBASE (VERSÃO COMPAT) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
  authDomain: "appvet-prt.firebaseapp.com",
  projectId: "appvet-prt",
  storageBucket: "appvet-prt.firebasestorage.app",
  messagingSenderId: "26046923372",
  appId: "1:26046923372:web:fdbe180eadced87018e49"
};

firebase.initializeApp(firebaseConfig);
</script>

<!-- AUTH GUARD SIMPLES -->
<script>
firebase.auth().onAuthStateChanged(user => {
    if (!user) {
        window.location.href = "login.html";
    }
});
</script>

<!-- MENU -->
<script>
fetch('./menu/menu.html')
.then(res => res.text())
.then(data => {
    document.getElementById('menu-container').innerHTML = data;

    const links = document.querySelectorAll('.menu a');
    links.forEach(link => {
        if (link.getAttribute('href') === 'dashboard.html') {
            link.classList.add('active');
        }
    });

    // NÃO depende mais de menu-permissoes.js pra liberar tela
    document.body.style.display = "block";
})
.catch(() => {
    // mesmo se o menu falhar, não trava tela
    document.body.style.display = "block";
});
</script>

</body>
</html>
