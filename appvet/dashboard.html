<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  display:none;
  background:#F5F7F9;
  font-family:'Inter', sans-serif;
}

/* CARDS */
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card {
  background:#fff;
  border:1px solid #E3E8EE;
  border-radius:10px;
  padding:20px;
}

.card-title { font-size:14px; color:#6B7280; }
.card-value { font-size:22px; font-weight:600; }

/* SEÇÕES */
.section {
  margin-top:20px;
  background:#fff;
  border:1px solid #E3E8EE;
  border-radius:10px;
  padding:20px;
}

.list-item {
  padding:10px 0;
  border-bottom:1px solid #E3E8EE;
}
</style>
</head>

<body>

<div id="menu-container"></div>

<!-- 🔥 CONTEUDO -->
<div id="conteudo">

  <div class="cards">
    <div class="card"><div class="card-title">Atendimentos Hoje</div><div class="card-value">12</div></div>
    <div class="card"><div class="card-title">Animais</div><div class="card-value">248</div></div>
    <div class="card"><div class="card-title">Clientes</div><div class="card-value">132</div></div>
    <div class="card"><div class="card-title">Vacinas Pendentes</div><div class="card-value">9</div></div>
  </div>

  <div class="section">
    <div class="list-item">09:00 - Consulta | Rex</div>
    <div class="list-item">10:30 - Vacina | Mia</div>
  </div>

</div>

<script>
fetch('./menu/menu.html')
.then(r=>r.text())
.then(html=>{
  document.getElementById('menu-container').innerHTML = html;

  // 🔥 injeta conteúdo dentro do menu
  document.getElementById('app-content')
          .appendChild(document.getElementById('conteudo'));

  // inicia menu
  initMenu();

  document.body.style.display="block";
});
</script>

</body>
</html>
