<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  display:none;
  font-family:Arial;
}

.cards {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.card {
  background:#fff;
  padding:20px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<div id="menu-container"></div>

<div id="conteudo">
  <div class="cards">
    <div class="card">12</div>
    <div class="card">248</div>
    <div class="card">132</div>
    <div class="card">9</div>
  </div>
</div>

<!-- LUCIDE -->
<script src="https://unpkg.com/lucide@latest"></script>

<script>
fetch('./menu/menu.html')
.then(r=>r.text())
.then(html=>{
  document.getElementById('menu-container').innerHTML = html;

  // injeta conteúdo no layout
  document.getElementById('app-content')
    .appendChild(document.getElementById('conteudo'));

  // 🔥 ATIVA LUCIDE
  lucide.createIcons();

  // 🔥 TOGGLE MENU
  document.getElementById('toggle-menu').onclick = ()=>{
    document.getElementById('sidebar').classList.toggle('collapsed');
  };

  // 🔥 TITULO
  document.getElementById('titulo-pagina').innerText = "Dashboard";

  document.body.style.display = "block";
});
</script>

</body>
</html>
