<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | APPVET</title>

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* BODY */

body{
font-family: 'Inter', sans-serif;
background:#F5F7F9;
height:100vh;
display:flex;
flex-direction:column;
}

/* CONTAINER */

.container{
flex:1;
display:flex;
}

/* LADO ESQUERDO */

.left{
flex:1;
background:linear-gradient(135deg,#2D6A4F,#74C69D);
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
text-align:center;
}

.left h1{
font-size:32px;
margin-bottom:10px;
}

.left p{
font-size:16px;
opacity:0.9;
}

/* LADO DIREITO */

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
background:#FFFFFF;
}

.login-box{
width:100%;
max-width:380px;
padding:30px;
}

.login-box h2{
margin-bottom:25px;
color:#1F2933;
}

/* INPUTS */

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
font-size:14px;
margin-bottom:5px;
color:#6B7280;
}

.form-group input{
width:100%;
padding:12px;
border:1px solid #E3E8EE;
border-radius:8px;
font-size:14px;
}

/* SENHA COM OLHO */

.password-wrapper{
position:relative;
}

.password-wrapper span{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* CHECKBOX */

.options{
display:flex;
align-items:center;
margin-bottom:15px;
font-size:14px;
}

/* BOTÃO */

button{
width:100%;
padding:12px;
background:#2D6A4F;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#1B4332;
}

/* LINK */

.link{
margin-top:10px;
font-size:13px;
text-align:center;
}

.link a{
color:#2F80ED;
text-decoration:none;
}

/* ERRO */

.error{
color:#E63946;
font-size:13px;
margin-bottom:10px;
display:none;
}

/* FOOTER */

.footer{
text-align:center;
font-size:12px;
padding:10px;
color:#6B7280;
border-top:1px solid #E3E8EE;
}

/* RESPONSIVO */

@media(max-width:768px){

.container{
flex-direction:column;
}

.left{
padding:20px;
}

}

</style>

</head>

<body>

<div class="container">

<!-- LADO ESQUERDO -->

<div class="left">

<h1>APPVET</h1>
<p>Gestão Veterinária Inteligente</p>

</div>

<!-- LADO DIREITO -->

<div class="right">

<div class="login-box">

<h2>🔐 Login</h2>

<div class="error" id="errorMsg"></div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="form-group">
<label>Senha</label>

<div class="password-wrapper">
<input type="password" id="senha">
<span onclick="toggleSenha()">👁️</span>
</div>

</div>

<div class="options">
<input type="checkbox" id="lembrar">
<label style="margin-left:5px;">Lembrar de mim</label>
</div>

<button onclick="login()">Entrar</button>

<div class="link">
<a href="#">Esqueceu a senha?</a>
</div>

</div>

</div>

</div>

<div class="footer">
Versão 1.0 | Suporte | Termos
</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
setPersistence,
browserLocalPersistence,
browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "appvet-prt.firebaseapp.com",
projectId: "appvet-prt",
storageBucket: "appvet-prt.firebasestorage.app",
messagingSenderId: "26046923372",
appId: "1:26046923372:web:fdbe180eadced87018e49"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* LOGIN */

window.login = async function(){

const email = document.getElementById('email').value;
const senha = document.getElementById('senha').value;
const lembrar = document.getElementById('lembrar').checked;
const erro = document.getElementById('errorMsg');

erro.style.display = "none";

try{

await setPersistence(auth,
lembrar ? browserLocalPersistence : browserSessionPersistence
);

await signInWithEmailAndPassword(auth, email, senha);

/* REDIRECIONA */

window.location.href = "appvet/dashboard.html";

}catch(e){

erro.innerText = "Email ou senha inválidos";
erro.style.display = "block";

}

}

/* MOSTRAR SENHA */

window.toggleSenha = function(){

const input = document.getElementById('senha');

if(input.type === "password"){
input.type = "text";
}else{
input.type = "password";
}

}

</script>

</body>
</html>
