<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | APPVET</title>

<link rel="stylesheet" href="appvet/css/variables.css">

<style>

body{
display:flex;
align-items:center;
justify-content:center;
height:100vh;
background:#F5F7F9;
font-family:'Inter',sans-serif;
}

.login-container{

background:#fff;
padding:40px;
border-radius:10px;
box-shadow:0 4px 20px rgba(0,0,0,0.05);

width:360px;

}

.login-logo{
text-align:center;
margin-bottom:20px;
}

.login-logo img{
height:60px;
}

.login-title{
text-align:center;
margin-bottom:25px;
font-weight:600;
color:#1F2933;
}

.form-group{
margin-bottom:15px;
}

label{
font-size:13px;
color:#6B7280;
display:block;
margin-bottom:5px;
}

input{

width:100%;
padding:10px;

border:1px solid #E3E8EE;
border-radius:6px;

}

button{

width:100%;
padding:12px;

background:#2E7D6B;
border:none;

color:#fff;

border-radius:8px;

font-weight:500;

cursor:pointer;

margin-top:10px;

}

button:hover{
background:#25675A;
}

.login-footer{

margin-top:20px;
font-size:12px;
text-align:center;
color:#6B7280;

}

</style>

</head>

<body>

<div class="login-container">

<div class="login-logo">

<img src="appvet/assets/images/logo-appvet.png" id="logoClinica">

</div>

<div class="login-title" id="nomeClinica">
Sistema de Gestão Veterinária
</div>

<form id="loginForm">

<div class="form-group">

<label>Email</label>

<input type="email" id="email" required>

</div>

<div class="form-group">

<label>Senha</label>

<input type="password" id="senha" required>

</div>

<button type="submit">Entrar</button>

</form>

<div class="login-footer">
Powered by PRT
</div>

</div>

<script type="module">

import { auth, db } from "./appvet/js/firebase-init.js";

import { signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { collection, query, where, getDocs, doc, getDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const logoClinica = document.getElementById("logoClinica");
const nomeClinica = document.getElementById("nomeClinica");

let clinicaId = null;

/* =============================
   IDENTIFICAR SUBDOMÍNIO
============================= */

async function carregarClinica(){

const host = window.location.hostname;

const subdomain = host.split(".")[0];

/* evitar pegar www ou domínio raiz */

if(subdomain === "www" || subdomain === "appvet"){
console.log("Login padrão APPVET");
return;
}

try{

const q = query(
collection(db,"clinicas"),
where("slug","==",subdomain)
);

const snapshot = await getDocs(q);

if(snapshot.empty){

console.warn("Clínica não encontrada para:", subdomain);
return;

}

const clinicaDoc = snapshot.docs[0];

const clinica = clinicaDoc.data();

clinicaId = clinicaDoc.id;

/* aplicar logo */

if(clinica.logoUrl){
logoClinica.src = clinica.logoUrl;
}

/* aplicar nome */

if(clinica.nome){
nomeClinica.innerText = clinica.nome;
}

/* aplicar cores */

if(clinica.corPrimaria){

document.documentElement.style.setProperty(
"--color-primary",
clinica.corPrimaria
);

}

if(clinica.corSecundaria){

document.documentElement.style.setProperty(
"--color-secondary",
clinica.corSecundaria
);

}

sessionStorage.setItem("clinicaId",clinicaId);

}catch(error){

console.error("Erro ao carregar clínica:", error);

}

}

await carregarClinica();

/* =============================
   LOGIN
============================= */

const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e)=>{

e.preventDefault();

const email = document.getElementById("email").value;
const senha = document.getElementById("senha").value;

try{

const userCredential =
await signInWithEmailAndPassword(auth,email,senha);

const uid = userCredential.user.uid;

/* buscar usuário */

const userDoc = await getDoc(doc(db,"usuarios",uid));

if(!userDoc.exists()){

alert("Usuário não encontrado no sistema");
return;

}

const userData = userDoc.data();

/* verificar clínica */

if(!clinicaId){
clinicaId = userData.clinicaId;
}

sessionStorage.setItem("usuarioId",uid);
sessionStorage.setItem("clinicaId",clinicaId);
sessionStorage.setItem("grupo",userData.grupo);

/* redirecionar */

window.location.href = "/app/dashboard.html";

}catch(error){

alert("Erro ao fazer login: " + error.message);

}

});

</script>

</body>

</html>
