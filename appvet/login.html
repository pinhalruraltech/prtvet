<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | APPVET</title>

<style>

/* VARIÁVEIS */

:root{
--color-primary:#2D6A4F;
--color-secondary:#74C69D;
--color-bg:#F5F7F9;
--color-white:#FFFFFF;
--color-text:#1F2933;
--color-muted:#6B7280;
}

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* BODY */

body{
font-family: 'Inter', sans-serif;
background:var(--color-bg);
height:100vh;
display:flex;
flex-direction:column;
}

/* CONTAINER */

.container{
flex:1;
display:flex;
}

/* LADO ESQUERDO */

.left{
flex:1;
background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
text-align:center;
}

.left img{
max-width:180px;
margin-bottom:15px;
}

.left p{
font-size:16px;
opacity:0.9;
}

/* LADO DIREITO */

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
background:var(--color-white);
}

.login-box{
width:100%;
max-width:380px;
padding:30px;
}

.login-title{
display:flex;
align-items:center;
gap:10px;
margin-bottom:25px;
color:var(--color-text);
}

.login-title svg{
width:22px;
height:22px;
}

/* INPUTS */

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
font-size:14px;
margin-bottom:5px;
color:var(--color-muted);
}

.form-group input{
width:100%;
padding:12px;
border:1px solid #E3E8EE;
border-radius:8px;
font-size:14px;
}

/* SENHA */

.password-wrapper{
position:relative;
}

.password-wrapper svg{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
width:18px;
height:18px;
color:#6B7280;
}

/* CHECKBOX */

.options{
display:flex;
align-items:center;
margin-bottom:15px;
font-size:14px;
}

/* BOTÃO */

button{
width:100%;
padding:12px;
background:var(--color-primary);
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#1B4332;
}

/* LINK */

.link{
margin-top:10px;
font-size:13px;
text-align:center;
}

.link a{
color:#2F80ED;
text-decoration:none;
}

/* ALERTA */

.alert{
font-size:13px;
margin-bottom:10px;
padding:10px;
border-radius:6px;
display:none;
}

.alert.error{
background:#fdecea;
color:#E63946;
}

.alert.success{
background:#e6f4ea;
color:var(--color-primary);
}

/* FOOTER */

.footer{
text-align:center;
font-size:12px;
padding:10px;
color:#6B7280;
border-top:1px solid #E3E8EE;
}

/* RESPONSIVO */

@media(max-width:768px){
.container{
flex-direction:column;
}
.left{
padding:20px;
}
}

</style>

</head>

<body>

<div class="container">

<!-- ESQUERDA -->

<div class="left">

<img id="logoClinica" src="logo/logo_rafael.png">
<p>Gestão Veterinária Inteligente</p>

</div>

<!-- DIREITA -->

<div class="right">

<div class="login-box">

<div class="login-title">

<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<rect x="3" y="11" width="18" height="11" rx="2"/>
<path d="M7 11V7a5 5 0 0 1 10 0v4"/>
</svg>

<h2>Login</h2>

</div>

<div id="alert" class="alert"></div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="form-group">
<label>Senha</label>

<div class="password-wrapper">
<input type="password" id="senha">

<svg onclick="toggleSenha()" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
<circle cx="12" cy="12" r="3"/>
</svg>

</div>

</div>

<div class="options">
<input type="checkbox" id="lembrar">
<label style="margin-left:5px;">Lembrar de mim</label>
</div>

<button onclick="login()">Entrar</button>

<div class="link">
<a href="#">Esqueceu a senha?</a>
</div>

</div>

</div>

</div>

<div class="footer">
Versão 1.0 | Suporte | Termos | Desenvolvido por PRT Soluções
</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
setPersistence,
browserLocalPersistence,
browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "appvet-prt.firebaseapp.com",
projectId: "appvet-prt",
storageBucket: "appvet-prt.firebasestorage.app",
messagingSenderId: "26046923372",
appId: "1:26046923372:web:fdbe180eadced87018e49"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function showAlert(msg, type){
const alert = document.getElementById("alert");
alert.innerText = msg;
alert.className = "alert " + type;
alert.style.display = "block";
}

window.login = async function(){

const email = document.getElementById('email').value;
const senha = document.getElementById('senha').value;
const lembrar = document.getElementById('lembrar').checked;

try{

await setPersistence(auth,
lembrar ? browserLocalPersistence : browserSessionPersistence
);

await signInWithEmailAndPassword(auth, email, senha);

showAlert("Login realizado com sucesso!", "success");

setTimeout(()=>{
window.location.href = "appvet/dashboard.html";
},1000);

}catch(e){

switch(e.code){

case "auth/user-not-found":
showAlert("Usuário não encontrado", "error");
break;

case "auth/wrong-password":
showAlert("Senha incorreta", "error");
break;

case "auth/invalid-email":
showAlert("Email inválido", "error");
break;

default:
showAlert("Email ou senha incorretos", "error");

}

}

}

window.toggleSenha = function(){
const input = document.getElementById('senha');
input.type = input.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
