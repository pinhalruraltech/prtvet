<style>
/* HEADER */
.app-header{
  height:60px;
  background:#2E7D6B;
  color:white;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 15px;
  position:sticky;
  top:0;
  z-index:5;
}

.menu-btn{
  background:none;
  border:none;
  color:white;
  cursor:pointer;
}

/* MENU */
.menu{
  position:fixed;
  left:-260px;
  top:0;
  width:260px;
  height:100%;
  background:#2E7D6B;
  color:white;
  transition:.3s;
  z-index:10;
  padding:20px 15px;
  overflow-y:auto;
}

.menu.open{
  left:0;
}

/* HEADER MENU */
.menu-header{
  margin-bottom:20px;
}

.menu-header strong{
  display:block;
  font-size:18px;
}

.menu-header span{
  font-size:12px;
  opacity:.8;
}

/* LINKS */
.menu nav a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-radius:8px;
  color:white;
  text-decoration:none;
}

.menu nav a:hover{
  background:#4DB6AC;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:9;
}

.overlay.show{
  display:block;
}
</style>

<script>
function toggleMenu(){
  const menu = document.getElementById("menu");
  const overlay = document.getElementById("overlay");

  menu.classList.toggle("open");
  overlay.classList.toggle("show");
}

document.getElementById("overlay").onclick = toggleMenu;

/* ATIVO AUTOMÁTICO */
const path = window.location.pathname;

document.querySelectorAll(".menu nav a").forEach(link=>{
  if(path.includes(link.getAttribute("href"))){
    link.style.background = "#1b5e55";
  }
});

/* ÍCONES */
if(window.lucide){
  lucide.createIcons();
}
</script>
