<script src="https://unpkg.com/lucide@latest"></script>

<script>
function initMenu() {

  lucide.createIcons();

  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  const btn = document.getElementById("toggle-menu");

  function isMobile() {
    return window.innerWidth <= 768;
  }

  // TOGGLE
  btn.onclick = () => {
    if (isMobile()) {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("show");
    } else {
      sidebar.classList.toggle("collapsed");
    }
  };

  // FECHAR MOBILE
  overlay.onclick = () => {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  };

  // 🔥 ATIVO INTELIGENTE
  const path = window.location.pathname;

  let activeKey = "";

  if (path.includes("cliente")) activeKey = "clientes";
  else if (path.includes("clientes")) activeKey = "clientes";
  else if (path.includes("animais")) activeKey = "animais";
  else if (path.includes("atendimentos")) activeKey = "atendimentos";
  else if (path.includes("agenda")) activeKey = "agenda";
  else if (path.includes("estoque")) activeKey = "estoque";
  else if (path.includes("financeiro")) activeKey = "financeiro";
  else if (path.includes("internacao")) activeKey = "internacao";
  else if (path.includes("documentos")) activeKey = "documentos";
  else if (path.includes("protocolos")) activeKey = "protocolos";
  else activeKey = "dashboard";

  document.querySelectorAll(".menu-item").forEach(item => {
    if (item.dataset.key === activeKey) {
      item.classList.add("active");
    }
  });

}
</script>
