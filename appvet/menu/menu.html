<style>
.app-header{
  height:60px;
  background:#2E7D6B;
  color:white;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 15px;
  position:sticky;
  top:0;
  z-index:5;
}

.menu-btn{
  background:none;
  border:none;
  color:white;
  cursor:pointer;
}

.menu{
  position:fixed;
  left:-260px;
  top:0;
  width:260px;
  height:100%;
  background:#2E7D6B;
  color:white;
  transition:.3s;
  z-index:10;
  padding:20px 15px;
  overflow-y:auto;
}

.menu.open{ left:0; }

.menu-header{ margin-bottom:20px; }

.menu-header strong{ display:block;font-size:18px; }

.menu-header span{ font-size:12px;opacity:.8; }

.menu nav a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-radius:8px;
  color:white;
  text-decoration:none;
}

.menu nav a:hover{ background:#4DB6AC; }

.menu nav a.active{
  background:#1b5e55;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:9;
}

.overlay.show{ display:block; }
</style>

<script>
function toggleMenu(){
  const menu = document.getElementById("menu");
  const overlay = document.getElementById("overlay");

  if(menu && overlay){
    menu.classList.toggle("open");
    overlay.classList.toggle("show");
  }
}

setTimeout(()=>{
  const overlay = document.getElementById("overlay");
  if(overlay){
    overlay.onclick = toggleMenu;
  }

  const path = window.location.pathname;

  document.querySelectorAll(".menu nav a").forEach(link=>{
    if(path.includes(link.dataset.key)){
      link.classList.add("active");
    }
  });

  if(window.lucide){
    lucide.createIcons();
  }

},100);
</script>
