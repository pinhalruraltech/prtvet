<script src="https://unpkg.com/lucide@latest"></script>

<script>
function initMenu() {

  // 🔥 FORÇA layout correto sempre
  document.querySelector(".layout").style.display = "flex";

  lucide.createIcons();

  document.getElementById("toggle-menu").onclick = () => {
    document.getElementById("sidebar").classList.toggle("collapsed");
  };

  const pagina = window.location.pathname.split("/").pop();

  const itens = document.querySelectorAll(".menu-item");

  itens.forEach(link => {
    if (link.getAttribute("href").includes(pagina)) {

      link.classList.add("active");

      const nome = link.innerText.trim();
      const icon = link.dataset.icon;

      document.getElementById("titulo-pagina").innerText = nome;

      document.getElementById("top-icon").outerHTML =
        `<i data-lucide="${icon}"></i>`;
    }
  });

  lucide.createIcons();

  if (window.firebase && firebase.auth) {
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        let nome = user.displayName || user.email || "Usuário";
        document.getElementById("nome-usuario").innerText = nome.split(" ")[0];
      }
    });
  }
}
</script>
