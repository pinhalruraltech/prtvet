<script>
  // 🔥 PEGAR PRIMEIRO NOME DO USUÁRIO LOGADO
  if (window.firebase && firebase.auth) {
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        let nome = user.displayName || user.email || "Usuário";
        let primeiroNome = nome.split(" ")[0];
        document.getElementById("nome-usuario").innerText = primeiroNome;
      }
    });
  }
</script>
