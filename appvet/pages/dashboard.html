<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | APPVET</title>

<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/topbar.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/tables.css">

</head>

<body style="display:none">

<script type="module">

/* =============================
PERMISSÃO DA PÁGINA
============================= */

window.PERMISSAO_PAGINA = "app.dashboard";

</script>

<script type="module" src="../js/firebase-init.js"></script>
<script type="module" src="../js/auth-guard.js"></script>

<div class="layout">

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<!-- CONTEÚDO -->
<div class="content">

<!-- TOPBAR -->
<div id="topbar-container"></div>

<main class="dashboard">

<h1>Dashboard</h1>

<!-- CARDS -->
<section class="card-grid">

<div class="card">

<div class="card-header">Consultas hoje</div>
<div id="consultasHoje">0</div>

</div>

<div class="card">

<div class="card-header">Clientes</div>
<div id="totalClientes">0</div>

</div>

<div class="card">

<div class="card-header">Animais</div>
<div id="totalAnimais">0</div>

</div>

<div class="card">

<div class="card-header">Vacinas pendentes</div>
<div id="vacinasPendentes">0</div>

</div>

</section>

<!-- AGENDA -->

<section class="card mt-20">

<div class="card-header">
Agenda de Hoje
</div>

<table class="table">

<thead>
<tr>
<th>Hora</th>
<th>Animal</th>
<th>Procedimento</th>
</tr>
</thead>

<tbody id="agendaHoje">

<tr>
<td colspan="3">Nenhum atendimento hoje</td>
</tr>

</tbody>

</table>

</section>

</main>

</div>

</div>

<script type="module">

import { db } from "../js/firebase-init.js";

import {
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =============================
CARREGAR DADOS DO DASHBOARD
============================= */

async function carregarDashboard(){

const clinicaId = sessionStorage.getItem("clinicaId");

if(!clinicaId){
return;
}

/* CLIENTES */

const clientesSnapshot = await getDocs(
query(collection(db,"clientes"),where("clinicaId","==",clinicaId))
);

document.getElementById("totalClientes").innerText =
clientesSnapshot.size;

/* ANIMAIS */

const animaisSnapshot = await getDocs(
query(collection(db,"animais"),where("clinicaId","==",clinicaId))
);

document.getElementById("totalAnimais").innerText =
animaisSnapshot.size;

}

carregarDashboard();

</script>

</body>

</html>
