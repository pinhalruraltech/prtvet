<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | APPVET</title>

<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/buttons.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/badges.css">

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside id="sidebar"></aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <div id="topbar"></div>


        <!-- PAGE -->
        <div class="page">

            <!-- HEADER -->
            <div class="page-header">

                <div class="page-title">
                    <h1>Clientes</h1>
                    <p>Gerencie proprietários e seus animais</p>
                </div>

                <button class="btn-primary">
                    + Novo Cliente
                </button>

            </div>



            <!-- CARD -->
            <div class="card">

                <!-- TOOLBAR -->
                <div class="card-header toolbar">

                    <div class="toolbar-left">

                        <input
                        type="text"
                        class="input-search"
                        placeholder="Buscar cliente ou animal..."
                        >

                    </div>


                    <div class="toolbar-right">

                        <select class="form-select">
                            <option>Cidade</option>
                        </select>

                        <select class="form-select">
                            <option>Possui animais</option>
                            <option>Sim</option>
                            <option>Não</option>
                        </select>

                        <button class="btn-outline">
                            Limpar filtros
                        </button>

                    </div>

                </div>



                <!-- TABELA -->
                <div class="card-body">

                    <table class="table">

                        <thead>

                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Cidade</th>
                            <th>Animais</th>
                            <th>Última visita</th>
                            <th></th>
                        </tr>

                        </thead>


                        <tbody>

                        <tr>

                            <td>João Silva</td>
                            <td>(35) 99999-9999</td>
                            <td>Monte Belo</td>

                            <td>
                                <span class="badge badge-info">
                                    🐾 3
                                </span>
                            </td>

                            <td>10/03/2026</td>

                            <td class="table-actions">

                                <button class="btn-icon">👁</button>
                                <button class="btn-icon">✏</button>
                                <button class="btn-icon btn-danger">🗑</button>

                            </td>

                        </tr>


                        <tr>

                            <td>Maria Oliveira</td>
                            <td>(35) 98888-8888</td>
                            <td>Alfenas</td>

                            <td>
                                <span class="badge badge-info">
                                    🐾 1
                                </span>
                            </td>

                            <td>02/03/2026</td>

                            <td class="table-actions">

                                <button class="btn-icon">👁</button>
                                <button class="btn-icon">✏</button>
                                <button class="btn-icon btn-danger">🗑</button>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>



                <!-- PAGINAÇÃO -->
                <div class="card-footer">

                    <div class="pagination-info">
                        Mostrando 1–10 de 230 clientes
                    </div>

                    <div class="pagination">

                        <button class="btn-page">‹</button>
                        <button class="btn-page active">1</button>
                        <button class="btn-page">2</button>
                        <button class="btn-page">3</button>
                        <button class="btn-page">4</button>
                        <button class="btn-page">›</button>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

</body>
</html>
