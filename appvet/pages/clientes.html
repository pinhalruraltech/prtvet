<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | APPVET</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Arial, sans-serif;
background:#F5F7F9;
}

/* BOTÃO MENU MOBILE */
#btnMenu{
position:fixed;
top:15px;
left:15px;
z-index:1100;
background:#2D6A4F;
color:#fff;
border:none;
padding:10px;
border-radius:8px;
font-size:18px;
}

/* SIDEBAR */
.sidebar{
width:240px;
height:100vh;
background:#1F2933;
color:#fff;
position:fixed;
top:0;
left:0;
transform:translateX(0);
transition:0.3s;
z-index:1000;
}

.sidebar .logo{
padding:20px;
font-weight:600;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.sidebar nav a{
display:flex;
align-items:center;
gap:10px;
padding:12px 20px;
color:#9CA3AF;
text-decoration:none;
}

.sidebar nav a:hover{
background:rgba(255,255,255,0.05);
color:#fff;
}

.sidebar nav a.active{
background:rgba(45,106,79,0.2);
color:#74C69D;
}

/* MOBILE */
@media(max-width:768px){

.sidebar{
transform:translateX(-100%);
}

.sidebar.active{
transform:translateX(0);
}

}

/* MAIN */
.main{
margin-left:240px;
padding:20px;
}

@media(max-width:768px){
.main{
margin-left:0;
}
}

/* CARD */
.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 6px rgba(0,0,0,0.05);
}

/* INPUT */
input{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
}

th, td{
padding:12px;
text-align:left;
border-bottom:1px solid #eee;
}

.badge{
background:#E6F4EA;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

</style>

</head>

<body style="display:none">

<!-- BOTÃO MENU -->
<button id="btnMenu">☰</button>

<!-- MENU -->
<div id="menu-container"></div>

<!-- CONTEÚDO -->
<div class="main">

<h1>Clientes</h1>
<p>Gerencie proprietários e seus animais</p>

<div class="card">

<input placeholder="Buscar cliente ou animal...">

<table>
<thead>
<tr>
<th>Nome</th>
<th>Telefone</th>
<th>Cidade</th>
<th>Animais</th>
<th>Última visita</th>
</tr>
</thead>

<tbody>
<tr>
<td>João Silva</td>
<td>(35) 99999-9999</td>
<td>Monte Belo</td>
<td><span class="badge">3</span></td>
<td>10/03/2026</td>
</tr>

<tr>
<td>Maria Oliveira</td>
<td>(35) 98888-8888</td>
<td>Alfenas</td>
<td><span class="badge">1</span></td>
<td>02/03/2026</td>
</tr>
</tbody>
</table>

</div>

</div>

<script type="module">

// CARREGAR MENU
fetch("../components/menu.html")
.then(res => res.text())
.then(html => {

document.getElementById("menu-container").innerHTML = html;

// ATIVAR ÍCONES
lucide.createIcons();

// MARCAR ATIVO
document.querySelectorAll(".sidebar a").forEach(link=>{
if(link.href === window.location.href){
link.classList.add("active");
}
});

// BOTÃO MENU
document.getElementById("btnMenu").addEventListener("click", ()=>{
document.getElementById("sidebar").classList.toggle("active");
});

// LIBERAR TELA
document.body.style.display = "block";

});

</script>

</body>
</html>
