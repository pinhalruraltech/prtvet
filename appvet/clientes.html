<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes | APPVET</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#F5F7F9;
}

/* BOTÃO MENU */
#btnMenu{
position:fixed;
top:15px;
left:15px;
z-index:1100;
background:#2D6A4F;
color:#fff;
border:none;
padding:10px;
border-radius:8px;
}

/* SIDEBAR */
.sidebar{
width:240px;
height:100vh;
background:#1F2933;
position:fixed;
top:0;
left:0;
transition:0.3s;
z-index:1000;
}

/* MOBILE */
@media(max-width:768px){
.sidebar{
transform:translateX(-100%);
}
.sidebar.active{
transform:translateX(0);
}
}

/* MAIN */
.main{
margin-left:240px;
padding:20px;
}

@media(max-width:768px){
.main{
margin-left:0;
}
}

/* HEADER */
.header{
margin-bottom:20px;
}

/* CARD */
.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 6px rgba(0,0,0,0.05);
}

/* FILTROS */
.filters{
display:flex;
gap:10px;
margin:10px 0;
flex-wrap:wrap;
}

.filters select,
.filters button{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
background:#fff;
}

/* INPUT */
input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th, td{
padding:12px;
border-bottom:1px solid #eee;
}

/* BADGE */
.badge{
background:#E6F4EA;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

/* AÇÕES */
.actions{
display:flex;
gap:10px;
}

.actions button{
border:none;
background:#eee;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

/* PAGINAÇÃO */
.pagination{
margin-top:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.pagination button{
padding:8px 12px;
border:none;
background:#2D6A4F;
color:#fff;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body style="display:none">

<button id="btnMenu">☰</button>

<div id="menu-container"></div>

<div class="main">

<div class="header">
<h1>Clientes</h1>
<p>Gerencie proprietários e seus animais</p>
</div>

<div class="card">

<input placeholder="Buscar cliente ou animal...">

<div class="filters">
<select>
<option>Cidade</option>
<option>Monte Belo</option>
<option>Alfenas</option>
</select>

<select>
<option>Possui animais</option>
<option>Sim</option>
<option>Não</option>
</select>

<button>Limpar filtros</button>
</div>

<table>
<thead>
<tr>
<th>Nome</th>
<th>Telefone</th>
<th>Cidade</th>
<th>Animais</th>
<th>Última visita</th>
<th>Ações</th>
</tr>
</thead>

<tbody>

<tr>
<td>João Silva</td>
<td>(35) 99999-9999</td>
<td>Monte Belo</td>
<td><span class="badge">3</span></td>
<td>10/03/2026</td>
<td class="actions">
<button>👁</button>
<button>✏️</button>
</td>
</tr>

<tr>
<td>Maria Oliveira</td>
<td>(35) 98888-8888</td>
<td>Alfenas</td>
<td><span class="badge">1</span></td>
<td>02/03/2026</td>
<td class="actions">
<button>👁</button>
<button>✏️</button>
</td>
</tr>

</tbody>
</table>

<div class="pagination">
<span>Mostrando 1–10 de 230 clientes</span>

<div>
<button>‹</button>
<button>1</button>
<button>›</button>
</div>

</div>

</div>

</div>

<script type="module">

fetch("../components/menu.html")
.then(res => res.text())
.then(html => {

document.getElementById("menu-container").innerHTML = html;

lucide.createIcons();

// ATIVO
document.querySelectorAll(".sidebar a").forEach(link=>{
if(link.href === window.location.href){
link.classList.add("active");
}
});

// MENU MOBILE
document.getElementById("btnMenu").addEventListener("click", ()=>{
document.querySelector(".sidebar").classList.toggle("active");
});

document.body.style.display = "block";

});

</script>

</body>
</html>
