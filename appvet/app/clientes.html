<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #F5F7F9;
  display: none;
}

.page { padding: 20px; }

.card {
  background: white;
  border: 1px solid #E3E8EE;
  border-radius: 12px;
  padding: 20px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.header h2 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
}

/* INPUT */
input {
  padding: 10px;
  border: 1px solid #E3E8EE;
  border-radius: 8px;
  width: 100%;
  max-width: 300px;
  margin-bottom: 10px;
}

/* BUTTON */
button {
  background: #2F80ED;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* TABLE */
table {
  width: 100%;
  margin-top: 10px;
  border-collapse: collapse;
}

th {
  text-align: left;
  font-size: 13px;
  color: #6B7280;
  border-bottom: 1px solid #E3E8EE;
  padding-bottom: 8px;
}

td {
  padding: 12px 0;
}

/* ZEBRA */
tbody tr:nth-child(even) {
  background: #F9FBFC;
}

tbody tr:hover {
  background: #EEF6F5;
}

.actions button {
  background: #10B981;
}

/* MOBILE */
@media (max-width: 768px) {

  table, thead, tbody, tr, td {
    display: block;
  }

  thead {
    display: none;
  }

  tr {
    background: white;
    margin-bottom: 10px;
    padding: 12px;
    border: 1px solid #E3E8EE;
    border-radius: 10px;
  }

  td {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
  }

  td::before {
    font-weight: 600;
    color: #6B7280;
  }

  td:nth-child(1)::before { content: "Nome"; }
  td:nth-child(2)::before { content: "Telefone"; }
  td:nth-child(3)::before { content: "Email"; }
}

/* MODAL */
.modal {
  position: fixed;
  inset:0;
  background: rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}

.modal input {
  width:100%;
  margin-bottom:10px;
}

/* FOOTER PADRÃO */
.footer {
  text-align:center;
  font-size:12px;
  padding:20px 10px;
  color:#6B7280;
}
</style>
</head>

<body>

<div id="menu-container"></div>

<script>
const PERMISSAO_PAGINA = { area:"app", chave:"clientes" };

const firebaseConfig = {
  apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
  authDomain: "appvet-prt.firebaseapp.com",
  projectId: "appvet-prt"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(async (user)=>{
  if(!user){
    window.location.href="../login.html";
    return;
  }

  await carregarMenu();
  document.body.style.display="block";
  carregarClientes();
});

async function carregarMenu(){
  const res = await fetch("/prtvet/appvet/menu/menu.html");
  document.getElementById("menu-container").innerHTML = await res.text();

  setTimeout(() => {
    if (typeof initMenu === "function") initMenu();
  }, 100);

  const container = document.getElementById("app-content");

  container.innerHTML = `
    <div class="page">

      <div class="card">

        <div class="header">
          <h2><i data-lucide="users"></i> Clientes</h2>
          <button onclick="abrirModal()">
            <i data-lucide="plus"></i> Novo
          </button>
        </div>

        <input type="text" id="busca" placeholder="Buscar cliente..." oninput="filtrar()">

        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Email</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="listaClientes"></tbody>
        </table>

      </div>

      <div class="footer">
        Desenvolvido por Pinhal Rural Tech • Versão 1.0
      </div>

    </div>

    <div class="modal" id="modal">
      <div class="modal-content">
        <h3>Novo Cliente</h3>

        <input id="nome" placeholder="Nome completo">
        <input id="telefone" placeholder="Telefone">
        <input id="email" placeholder="Email">

        <button onclick="salvarCliente()">Salvar</button>
      </div>
    </div>
  `;

  lucide.createIcons();
}

let clientes = [];

async function carregarClientes(){
  const snapshot = await db.collection("clientes").orderBy("nome").get();

  clientes = [];

  snapshot.forEach(doc=>{
    clientes.push({ id: doc.id, ...doc.data() });
  });

  render();
}

function render(lista = clientes){
  const tbody = document.getElementById("listaClientes");
  tbody.innerHTML="";

  lista.forEach(c=>{
    tbody.innerHTML += `
      <tr>
        <td>${c.nome || ""}</td>
        <td>${c.telefone || ""}</td>
        <td>${c.email || ""}</td>
        <td class="actions">
          <button onclick="abrirCliente('${c.id}')">Ver</button>
        </td>
      </tr>
    `;
  });
}

function abrirCliente(id){
  window.location.href = "cliente.html?id=" + id;
}

function filtrar(){
  const termo = document.getElementById("busca").value.toLowerCase();
  render(clientes.filter(c => (c.nome || "").toLowerCase().includes(termo)));
}

function abrirModal(){
  document.getElementById("modal").style.display="flex";
}

async function salvarCliente(){
  const nome = document.getElementById("nome").value;

  if(!nome){
    alert("Nome obrigatório");
    return;
  }

  const codigo = "CLI-" + Date.now();

  await db.collection("clientes").add({
    codigo,
    nome,
    telefone: document.getElementById("telefone").value,
    email: document.getElementById("email").value,
    situacao: "ativo",
    animais: [],
    endereco: {},
    createdAt: new Date()
  });

  document.getElementById("modal").style.display="none";
  carregarClientes();
}
</script>

</body>
</html>
