<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#F5F7F9;
  display:none;
}

/* LAYOUT */
.page {
  padding:20px;
  max-width:1000px;
  margin:auto;
}

.card {
  background:#FFF;
  border:1px solid #E3E8EE;
  border-radius:12px;
  padding:20px;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.header h2 {
  display:flex;
  gap:8px;
  align-items:center;
}

/* BOTÕES */
.btn {
  background:#2D6A4F;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

.btn-sec {
  background:#E5E7EB;
  color:#111;
}

/* INPUT */
input {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #E3E8EE;
  margin-bottom:10px;
}

/* CARD CLIENTE */
.cliente-card {
  border:1px solid #E3E8EE;
  border-radius:10px;
  padding:15px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cliente-info {
  display:flex;
  flex-direction:column;
  gap:5px;
}

.cliente-info span {
  font-size:14px;
}

.cliente-info strong {
  font-weight:600;
}

.btn-ver {
  background:#2D6A4F;
  color:white;
  padding:8px 14px;
  border-radius:8px;
  border:none;
}

/* PAGINAÇÃO */
.pagination {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
}

/* MODAL */
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:12px;
  width:95%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
}

/* FOOTER */
.footer {
  text-align:center;
  font-size:12px;
  margin-top:20px;
  color:#6B7280;
}
</style>
</head>

<body>

<div id="menu-container"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
  authDomain: "appvet-prt.firebaseapp.com",
  projectId: "appvet-prt"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let clientes = [];
let paginaAtual = 1;
const porPagina = 6;

auth.onAuthStateChanged(async (user)=>{
  if(!user){
    window.location.href="../login.html";
    return;
  }

  await carregarMenu();
  document.body.style.display="block";
  carregarClientes();
});

async function carregarMenu(){
  const res = await fetch("/prtvet/appvet/menu/menu.html");
  document.getElementById("menu-container").innerHTML = await res.text();

  setTimeout(()=>{
    if(typeof initMenu==="function") initMenu();
  },150);

  document.getElementById("app-content").innerHTML = `
  <div class="page">

    <div class="card">

      <div class="header">
        <h2><i data-lucide="users"></i> Clientes</h2>
        <button class="btn" onclick="abrirModal()">+ Novo</button>
      </div>

      <input id="busca" placeholder="Buscar cliente..." oninput="filtrar()">

      <div id="listaClientes"></div>

      <div class="pagination" id="paginacao"></div>

    </div>

    <div class="footer">
      Versão 1.0 | Suporte | Termos | Desenvolvido por PRT Soluções
    </div>

  </div>

  <div class="modal" id="modal">
    <div class="modal-content">

      <h3>Novo Cliente</h3>

      <input id="nome" placeholder="Nome completo">
      <input id="telefone" placeholder="Telefone">
      <input id="cidade" placeholder="Cidade">

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn-sec" onclick="fecharModal()">Cancelar</button>
        <button class="btn" onclick="salvarCliente()">Salvar</button>
      </div>

    </div>
  </div>
  `;

  lucide.createIcons();
}

async function carregarClientes(){
  const snap = await db.collection("clientes").get();
  clientes = [];
  snap.forEach(doc => clientes.push({ id: doc.id, ...doc.data() }));
  render();
}

function render(lista = clientes){

  const inicio = (paginaAtual-1)*porPagina;
  const paginados = lista.slice(inicio, inicio+porPagina);

  const el = document.getElementById("listaClientes");
  el.innerHTML="";

  paginados.forEach(c=>{
    el.innerHTML += `
      <div class="cliente-card">
        <div class="cliente-info">
          <span><strong>${c.nome || "-"}</strong></span>
          <span>📞 ${c.telefone || "-"}</span>
          <span>📍 ${c.endereco?.cidade || "-"}</span>
        </div>
        <button class="btn-ver" onclick="abrirCliente('${c.id}')">Ver</button>
      </div>
    `;
  });

  renderPaginacao(lista.length);
}

function renderPaginacao(total){
  const totalPaginas = Math.ceil(total / porPagina);
  const el = document.getElementById("paginacao");
  el.innerHTML="";

  for(let i=1;i<=totalPaginas;i++){
    el.innerHTML += `
      <button onclick="irPagina(${i})">${i}</button>
    `;
  }
}

function irPagina(p){
  paginaAtual = p;
  render();
}

function filtrar(){
  const t = busca.value.toLowerCase();
  paginaAtual = 1;
  render(clientes.filter(c => (c.nome||"").toLowerCase().includes(t)));
}

function abrirCliente(id){
  window.location.href="cliente.html?id="+id;
}

function abrirModal(){
  modal.style.display="flex";
}

function fecharModal(){
  modal.style.display="none";
}

async function salvarCliente(){
  await db.collection("clientes").add({
    nome:nome.value,
    telefone:telefone.value,
    endereco:{ cidade:cidade.value }
  });

  fecharModal();
  carregarClientes();
}
</script>

</body>
</html>
