<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #F5F7F9;
  display: none;
}

.page { padding: 20px; }

.card {
  background: white;
  border: 1px solid #E3E8EE;
  border-radius: 12px;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h2 {
  display:flex;
  gap:8px;
  align-items:center;
}

button {
  background: #2F80ED;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
}

input {
  padding:10px;
  border:1px solid #E3E8EE;
  border-radius:8px;
  margin-top:10px;
  width:100%;
}

/* LISTA */
.cliente-item {
  border:1px solid #E3E8EE;
  border-radius:10px;
  padding:15px;
  margin-top:10px;
}

.cliente-item p {
  margin:4px 0;
}

.cliente-item strong {
  font-weight:600;
}

/* MODAL */
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:12px;
  width:95%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
}

.modal-actions {
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:10px;
}

.footer {
  text-align:center;
  font-size:12px;
  padding:20px;
  color:#6B7280;
}
</style>
</head>

<body>

<div id="menu-container"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
  authDomain: "appvet-prt.firebaseapp.com",
  projectId: "appvet-prt"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(async (user)=>{
  if(!user){
    window.location.href="../login.html";
    return;
  }

  await carregarMenu();
  document.body.style.display="block";
  carregarClientes();
});

async function carregarMenu(){
  const res = await fetch("/prtvet/appvet/menu/menu.html");
  document.getElementById("menu-container").innerHTML = await res.text();

  setTimeout(() => {
    if (typeof initMenu === "function") initMenu();
  }, 150);

  const container = document.getElementById("app-content");

  container.innerHTML = `
    <div class="page">

      <div class="card">

        <div class="header">
          <h2><i data-lucide="users"></i> Clientes</h2>
          <button onclick="abrirModal()"><i data-lucide="plus"></i> Novo</button>
        </div>

        <input id="busca" placeholder="Buscar..." oninput="filtrar()">

        <div id="listaClientes"></div>

      </div>

      <div class="footer">
        Versão 1.0 | Suporte | Termos | Desenvolvido por PRT Soluções
      </div>

    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
      <div class="modal-content">

        <h3>Novo Cliente</h3>

        <input id="nome" placeholder="Nome completo">
        <input id="cpf" placeholder="CPF">
        <input id="nascimento" type="date">
        <input id="telefone" placeholder="Telefone">
        <input id="email" placeholder="Email">

        <input id="logradouro" placeholder="Logradouro">
        <input id="numero" placeholder="Número">
        <input id="bairro" placeholder="Bairro">
        <input id="cidade" placeholder="Cidade">
        <input id="estado" placeholder="Estado">
        <input id="cep" placeholder="CEP">

        <div class="modal-actions">
          <button onclick="confirmarCancelar()">Cancelar</button>
          <button onclick="confirmarSalvar()">Salvar</button>
        </div>

      </div>
    </div>
  `;

  lucide.createIcons();
}

let clientes = [];

async function carregarClientes(){
  const snap = await db.collection("clientes").get();
  clientes = [];
  snap.forEach(doc => clientes.push({ id: doc.id, ...doc.data() }));
  render();
}

function render(lista = clientes){
  const el = document.getElementById("listaClientes");
  el.innerHTML = "";

  lista.forEach(c=>{
    el.innerHTML += `
      <div class="cliente-item">
        <p><strong>Nome:</strong> ${c.nome || ""}</p>
        <p><strong>Telefone:</strong> ${c.telefone || ""}</p>
        <p><strong>Bairro:</strong> ${c.endereco?.bairro || ""}</p>
        <p><strong>Cidade:</strong> ${c.endereco?.cidade || ""}</p>
        <button onclick="abrirCliente('${c.id}')">Ver</button>
      </div>
    `;
  });
}

function filtrar(){
  const t = document.getElementById("busca").value.toLowerCase();
  render(clientes.filter(c => (c.nome||"").toLowerCase().includes(t)));
}

function abrirCliente(id){
  window.location.href = "cliente.html?id=" + id;
}

function abrirModal(){
  document.getElementById("modal").style.display="flex";
}

function confirmarCancelar(){
  if(confirm("Deseja cancelar?")){
    document.getElementById("modal").style.display="none";
  }
}

function confirmarSalvar(){
  if(confirm("Salvar cliente?")){
    salvarCliente();
  }
}

async function salvarCliente(){

  await db.collection("clientes").add({
    nome: nome.value,
    cpf: cpf.value,
    nascimento: nascimento.value,
    telefone: telefone.value,
    email: email.value,
    situacao:"ativo",
    endereco:{
      logradouro:logradouro.value,
      numero:numero.value,
      bairro:bairro.value,
      cidade:cidade.value,
      estado:estado.value,
      cep:cep.value
    },
    animais:[],
    createdAt:new Date()
  });

  modal.style.display="none";
  carregarClientes();
}
</script>

</body>
</html>
