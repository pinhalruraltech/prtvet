<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Clientes | AppVet</title>

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Inter;
  background: #F5F7F9;
  display: none;
}

.page {
  padding: 20px;
}

.card {
  background: white;
  border: 1px solid #E3E8EE;
  border-radius: 10px;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

input {
  padding: 8px;
  border: 1px solid #E3E8EE;
  border-radius: 6px;
}

button {
  background: #2F80ED;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
}

table {
  width: 100%;
  margin-top: 15px;
  border-collapse: collapse;
}

th, td {
  border-bottom: 1px solid #EEE;
  padding: 10px 0;
}

.modal {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:10px;
  width:400px;
}

.modal input {
  width:100%;
  margin-bottom:10px;
}

.footer {
  text-align:center;
  font-size:12px;
  padding:10px;
  color:#6B7280;
}
</style>
</head>

<body>

<div id="menu-container"></div>

<script>
const PERMISSAO_PAGINA = { area:"app", chave:"clientes" };

const firebaseConfig = {
  apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
  authDomain: "appvet-prt.firebaseapp.com",
  projectId: "appvet-prt",
  storageBucket: "appvet-prt.firebasestorage.app",
  messagingSenderId: "26046923372",
  appId: "1:26046923372:web:fdbe180eadced87018e49"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(async (user)=>{
  if(!user){
    window.location.href="../login.html";
    return;
  }

  await carregarMenu();
  document.body.style.display="block";
  carregarClientes();
});

async function carregarMenu(){
  const res = await fetch("../menu/menu.html");
  document.getElementById("menu-container").innerHTML = await res.text();

  const container = document.querySelector(".page-content");

  container.innerHTML = `
    <div class="page">

      <div class="card">

        <div class="header">
          <h2>Clientes</h2>
          <button onclick="abrirModal()">Novo Cliente</button>
        </div>

        <input type="text" id="busca" placeholder="Buscar cliente..." oninput="filtrar()">

        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="listaClientes"></tbody>
        </table>

      </div>

      <div class="footer">
        © 2026 AppVet
      </div>

    </div>

    <div class="modal" id="modal">
      <div class="modal-content">
        <h3>Novo Cliente</h3>

        <input id="nome" placeholder="Nome completo">
        <input id="cpf" placeholder="CPF">
        <input id="telefone" placeholder="Telefone">
        <input id="email" placeholder="Email">

        <button onclick="salvarCliente()">Salvar</button>
      </div>
    </div>
  `;

  document.querySelectorAll(".menu a").forEach(link=>{
    if(link.href.includes("clientes.html")){
      link.classList.add("active");
    }
  });

  const script = document.createElement("script");
  script.src = "../js/menu-permissoes.js";
  script.onload = ()=>lucide.createIcons();
  document.body.appendChild(script);
}

let clientes = [];

async function carregarClientes(){
  const snapshot = await db.collection("clientes").orderBy("nome").get();

  clientes = [];

  snapshot.forEach(doc=>{
    clientes.push({ id: doc.id, ...doc.data() });
  });

  render();
}

function render(lista = clientes){
  const tbody = document.getElementById("listaClientes");
  tbody.innerHTML="";

  lista.forEach(c=>{
    tbody.innerHTML += `
      <tr>
        <td>${c.nome || ""}</td>
        <td>${c.telefone || ""}</td>
        <td>${c.email || ""}</td>
      </tr>
    `;
  });
}

function filtrar(){
  const termo = document.getElementById("busca").value.toLowerCase();

  const filtrado = clientes.filter(c =>
    (c.nome || "").toLowerCase().includes(termo)
  );

  render(filtrado);
}

function abrirModal(){
  document.getElementById("modal").style.display="flex";
}

async function salvarCliente(){
  const nome = document.getElementById("nome").value;

  if(!nome){
    alert("Nome obrigatório");
    return;
  }

  await db.collection("clientes").add({
    nome,
    cpf: document.getElementById("cpf").value,
    telefone: document.getElementById("telefone").value,
    email: document.getElementById("email").value,
    createdAt: new Date()
  });

  document.getElementById("modal").style.display="none";

  carregarClientes();
}
</script>

</body>
</html>
