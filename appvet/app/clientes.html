<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clientes | AppVet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- LUCIDE -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #F5F7F9;
      display: none;
    }

    .content {
      padding: 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #E3E8EE;
      border-radius: 10px;
      padding: 20px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    input {
      padding: 8px 10px;
      border: 1px solid #E3E8EE;
      border-radius: 6px;
    }

    button {
      background: #2F80ED;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 13px;
      color: #6B7280;
      border-bottom: 1px solid #E3E8EE;
      padding-bottom: 10px;
    }

    td {
      padding: 12px 0;
      border-bottom: 1px solid #F1F3F5;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      padding: 10px;
      color: #6B7280;
      border-top: 1px solid #E3E8EE;
      background: white;
    }
  </style>
</head>

<body>

<!-- MENU (SIDEBAR + TOPBAR) -->
<div id="menu-container"></div>

<!-- CONTEÚDO -->
<div class="content">

  <div class="card">
    <h2>Gestão de Clientes</h2>

    <div class="actions">
      <input type="text" placeholder="Buscar cliente...">
      <button onclick="novoCliente()">
        <i data-lucide="plus"></i> Novo Cliente
      </button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Email</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaClientes"></tbody>
    </table>
  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  © 2026 AppVet - Sistema de Gestão Veterinária
</div>

<script>
  // 🔐 PERMISSÃO
  const PERMISSAO_PAGINA = {
    area: "app",
    chave: "clientes"
  };

  // 🔥 FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
    authDomain: "appvet-prt.firebaseapp.com",
    projectId: "appvet-prt",
    storageBucket: "appvet-prt.firebasestorage.app",
    messagingSenderId: "26046923372",
    appId: "1:26046923372:web:fdbe180eadced87018e49"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // 🔐 AUTH
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = "../login.html";
      return;
    }

    await carregarMenu();
    carregarClientes();

    document.body.style.display = "block";
  });

  // 📌 CARREGAR MENU PADRÃO
  async function carregarMenu() {
    const res = await fetch("../menu/menu.html");
    const html = await res.text();
    document.getElementById("menu-container").innerHTML = html;

    // marca ativo
    const links = document.querySelectorAll(".menu a");
    links.forEach(link => {
      if (link.href.includes("clientes.html")) {
        link.classList.add("active");
      }
    });

    // injeta permissões
    const script = document.createElement("script");
    script.src = "../js/menu-permissoes.js";

    script.onload = () => {
      lucide.createIcons();
    };

    document.body.appendChild(script);
  }

  // 📋 LISTAR CLIENTES
  async function carregarClientes() {
    const lista = document.getElementById("listaClientes");
    lista.innerHTML = "";

    const snapshot = await db.collection("clientes").get();

    snapshot.forEach(doc => {
      const c = doc.data();

      lista.innerHTML += `
        <tr>
          <td>${c.nome || ""}</td>
          <td>${c.telefone || ""}</td>
          <td>${c.email || ""}</td>
          <td>
            <button onclick="editar('${doc.id}')">
              <i data-lucide="pencil"></i>
            </button>
          </td>
        </tr>
      `;
    });

    lucide.createIcons();
  }

  function novoCliente() {
    alert("Cadastro em breve");
  }

  function editar(id) {
    alert("Editar: " + id);
  }
</script>

</body>
</html>
