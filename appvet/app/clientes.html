<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#F5F7F9;
  display:none;
}

/* BOTÃO MOBILE */
#open-menu-mobile{
  position:fixed;
  top:15px;
  left:15px;
  z-index:20;
  background:#2E7D6B;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
}

/* CONTEÚDO */
.page { padding:20px; max-width:1000px; margin:auto; }

.card {
  background:#FFF;
  border:1px solid #E3E8EE;
  border-radius:12px;
  padding:20px;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.btn {
  background:#2D6A4F;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

input {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #E3E8EE;
  margin-bottom:10px;
}

.cliente-card {
  border:1px solid #E3E8EE;
  border-radius:10px;
  padding:15px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.footer {
  text-align:center;
  font-size:12px;
  margin-top:20px;
  color:#6B7280;
}
</style>
</head>

<body>

<button id="open-menu-mobile">☰</button>

<div id="menu-container"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
  authDomain: "appvet-prt.firebaseapp.com",
  projectId: "appvet-prt"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let clientes = [];

auth.onAuthStateChanged(async (user)=>{
  if(!user){
    window.location.href="../login.html";
    return;
  }

  await carregarMenu();
  document.body.style.display="block";
  carregarClientes();
});

async function carregarMenu(){

  const res = await fetch("/prtvet/appvet/menu/menu.html");
  document.getElementById("menu-container").innerHTML = await res.text();

  requestAnimationFrame(() => {
    if(typeof initMenu==="function") initMenu();

    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const openBtn = document.getElementById("open-menu-mobile");

    if(openBtn){
      openBtn.onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("show");
      };
    }
  });

  const container = document.getElementById("app-content");

  container.innerHTML = `
    <div class="page">
      <div class="card">

        <div class="header">
          <h2><i data-lucide="users"></i> Clientes</h2>
          <button class="btn">+ Novo</button>
        </div>

        <input placeholder="Buscar...">

        <div id="listaClientes"></div>

      </div>

      <div class="footer">
        Versão 1.0 | Suporte | Termos | Desenvolvido por PRT Soluções
      </div>
    </div>
  `;

  lucide.createIcons();
}

async function carregarClientes(){
  const snap = await db.collection("clientes").get();

  clientes = [];
  snap.forEach(doc => clientes.push({ id: doc.id, ...doc.data() }));

  renderClientes();
}

function renderClientes(){

  const el = document.getElementById("listaClientes");
  el.innerHTML = "";

  if(clientes.length === 0){
    el.innerHTML = "<p>Nenhum cliente encontrado</p>";
    return;
  }

  clientes.forEach(c=>{
    el.innerHTML += `
      <div class="cliente-card">
        <div>
          <strong>${c.nome || "-"}</strong><br>
          📞 ${c.telefone || "-"}
        </div>
        <button class="btn">Ver</button>
      </div>
    `;
  });
}
</script>

</body>
</html>
