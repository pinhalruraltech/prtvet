<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clientes | AppVet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- LUCIDE ICONS -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #F5F7F9;
      color: #1F2933;
    }

    .layout {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #1F2933;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px 10px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo img {
      width: 100%;
      max-width: 140px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      color: #ccc;
      text-decoration: none;
      margin-bottom: 5px;
      transition: 0.2s;
    }

    .menu a:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }

    .menu a.active {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* TOPBAR */
    .topbar {
      height: 60px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #E3E8EE;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #6B7280;
    }

    /* CONTENT */
    .content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .card {
      background: white;
      border: 1px solid #E3E8EE;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    input {
      padding: 8px 10px;
      border: 1px solid #E3E8EE;
      border-radius: 6px;
      outline: none;
    }

    button {
      background: #2F80ED;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 13px;
      color: #6B7280;
      padding-bottom: 10px;
      border-bottom: 1px solid #E3E8EE;
    }

    td {
      padding: 12px 0;
      border-bottom: 1px solid #F1F3F5;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      padding: 10px;
      color: #6B7280;
      border-top: 1px solid #E3E8EE;
      background: white;
    }
  </style>
</head>

<body style="display:none">

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <img src="../icons/logo.png" alt="Logo">
      <div>AppVet</div>
    </div>

    <div class="menu">
      <a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="clientes.html" class="active"><i data-lucide="users"></i> Clientes</a>
      <a href="animais.html"><i data-lucide="paw-print"></i> Animais</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <div><strong>Clientes</strong></div>
      <div class="user">
        <i data-lucide="user"></i>
        <span id="userNome">...</span>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <div class="card">
        <h2>Gestão de Clientes</h2>

        <div class="actions">
          <input type="text" placeholder="Buscar cliente...">
          <button onclick="novoCliente()">
            <i data-lucide="plus"></i> Novo Cliente
          </button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Email</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="listaClientes">
            <!-- Dados virão do Firestore -->
          </tbody>
        </table>

      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      © 2026 AppVet - Sistema de Gestão Veterinária
    </div>

  </div>

</div>

<script>
  // 🔐 PERMISSÃO DA PÁGINA
  const PERMISSAO_PAGINA = {
    area: "app",
    chave: "clientes"
  };

  // 🔥 FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyDR69colU9JHvemBpab3x8PLHqaUm_5EM0",
    authDomain: "appvet-prt.firebaseapp.com",
    projectId: "appvet-prt",
    storageBucket: "appvet-prt.firebasestorage.app",
    messagingSenderId: "26046923372",
    appId: "1:26046923372:web:fdbe180eadced87018e49"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // 🔐 AUTH + USUÁRIO
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = "../index.html";
      return;
    }

    const doc = await db.collection("usuarios").doc(user.uid).get();
    const dados = doc.data();

    document.getElementById("userNome").innerText = dados?.Nome?.split(" ")[0] || "Usuário";

    document.body.style.display = "block";

    carregarClientes();
  });

  // 📋 LISTAR CLIENTES
  async function carregarClientes() {
    const lista = document.getElementById("listaClientes");
    lista.innerHTML = "";

    const snapshot = await db.collection("clientes").get();

    snapshot.forEach(doc => {
      const c = doc.data();

      lista.innerHTML += `
        <tr>
          <td>${c.nome || ""}</td>
          <td>${c.telefone || ""}</td>
          <td>${c.email || ""}</td>
          <td>
            <button onclick="editar('${doc.id}')">
              <i data-lucide="pencil"></i>
            </button>
          </td>
        </tr>
      `;
    });

    lucide.createIcons();
  }

  function novoCliente() {
    alert("Abrir tela de cadastro futuramente");
  }

  function editar(id) {
    alert("Editar cliente: " + id);
  }

  lucide.createIcons();
</script>

</body>
</html>
