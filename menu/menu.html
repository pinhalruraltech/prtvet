<!-- ESTILO EMBUTIDO -->
<style>
.appvet-menu * {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

/* TOPBAR */
.topbar {
    display: none;
    background: white;
    padding: 12px;
    border-bottom: 1px solid #E3E8EE;
    align-items: center;
    gap: 10px;
}

#menu-btn {
    background: none;
    border: none;
    cursor: pointer;
}

.page-title {
    font-weight: 600;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    background: #1F2933;
    color: white;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    padding: 20px;
    transition: transform 0.3s ease;
    z-index: 1000;
}

.logo {
    margin-bottom: 30px;
    font-size: 18px;
}

/* MENU ITEMS */
.menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    color: #D1D5DB;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.2s;
}

.menu-item:hover {
    background: rgba(255,255,255,0.1);
}

.menu-item.active {
    background: #2D6A4F;
    color: white;
}

.menu-item i {
    width: 18px;
    height: 18px;
}

/* MOBILE */
@media (max-width: 768px) {

    .topbar {
        display: flex;
    }

    .sidebar {
        transform: translateX(-100%);
    }

    .sidebar.open {
        transform: translateX(0);
    }
}
</style>

<!-- JS EMBUTIDO -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>

function initMenu() {

    const btn = document.getElementById("menu-btn");
    const sidebar = document.getElementById("sidebar");

    if (btn && sidebar) {
        btn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
        });
    }

    // Ativar ícones
    if (window.lucide) {
        lucide.createIcons();
    }

    // Link ativo automático
    const links = document.querySelectorAll(".menu-item");
    const current = window.location.pathname;

    links.forEach(link => {
        if (current.includes(link.getAttribute("href"))) {
            link.classList.add("active");
        }
    });
}

// Garante execução mesmo com fetch
setTimeout(initMenu, 100);

</script>
