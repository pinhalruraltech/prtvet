<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Início | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="./menu/menu.css">

<!-- 🔐 PERMISSÃO -->
<script>
const PERMISSAO_PAGINA = {
    area: "app",
    chave: "inicio"
};
</script>

<!-- 🔐 AUTH -->
<script type="module" src="./js/auth-guard.js"></script>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter';background:#F5F7F9;}

.header{
    background:#2D6A4F;
    color:#fff;
    padding:20px;
}

.header h1{
    margin:0;
    font-size:20px;
}

.container{
    padding:16px;
}

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:14px;
    border:1px solid #E5E7EB;
}

.card-title{
    font-size:13px;
    color:#6B7280;
}

.card-value{
    font-size:22px;
    font-weight:600;
    margin-top:4px;
}

.section{
    background:#fff;
    border-radius:12px;
    padding:14px;
    border:1px solid #E5E7EB;
}

.section-title{
    font-weight:600;
    margin-bottom:10px;
}

.item{
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.item:last-child{
    border-bottom:none;
}
</style>

</head>

<body style="display:none;">

<div id="menu-container"></div>

<div class="header">
    <h1>Início</h1>
</div>

<div class="container">

    <div class="cards">
        <div class="card">
            <div class="card-title">Clientes</div>
            <div class="card-value" id="totalClientes">0</div>
        </div>

        <div class="card">
            <div class="card-title">Animais</div>
            <div class="card-value" id="totalAnimais">0</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Agenda de Hoje</div>
        <div id="listaAgenda">
            Nenhum agendamento hoje
        </div>
    </div>

</div>

<!-- 🔥 SCRIPT PRINCIPAL -->
<script type="module">

import { db } from "./js/firebase-init.js";
import { carregarClinica } from "./js/clinica-loader.js";

import {
    collection, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔐 DADOS */
const uid = localStorage.getItem("uid");
const clinicaId = localStorage.getItem("clinicaId");

if(!uid || !clinicaId){
    window.location.href = "./login.html";
}

/* 🔧 CLÍNICA */
await carregarClinica();

/* 🔥 MENU (PADRÃO CORRETO) */
fetch("./menu/menu.html")
.then(res => res.text())
.then(async html => {

    document.getElementById("menu-container").innerHTML = html;

    /* IMPORT DINÂMICO (CORRETO) */
    const menuModule = await import("./menu/menu.js");

    menuModule.initMenu();        // 🔥 ESSENCIAL
    await menuModule.carregarMenu();

    /* ATIVO */
    document.querySelectorAll(".menu-item").forEach(link=>{
        if(link.getAttribute("data-link") === "inicio"){
            link.classList.add("active");
        }
    });

    lucide.createIcons();
    document.body.style.display = "block";

});

/* 📊 CLIENTES */
async function carregarClientes(){
    const q = query(
        collection(db,"clientes"),
        where("clinicaId","==",clinicaId)
    );

    const snap = await getDocs(q);
    document.getElementById("totalClientes").innerText = snap.size;
}

/* 🐶 ANIMAIS */
async function carregarAnimais(){
    const q = query(
        collection(db,"animais"),
        where("clinicaId","==",clinicaId)
    );

    const snap = await getDocs(q);
    document.getElementById("totalAnimais").innerText = snap.size;
}

/* 📅 AGENDA */
async function carregarAgenda(){
    const q = query(
        collection(db,"agenda"),
        where("clinicaId","==",clinicaId)
    );

    const snap = await getDocs(q);

    const lista = document.getElementById("listaAgenda");

    if(snap.empty){
        lista.innerHTML = "Nenhum agendamento hoje";
        return;
    }

    lista.innerHTML = "";

    snap.forEach(doc=>{
        const d = doc.data();

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <strong>${d.hora || "--:--"}</strong> - ${d.titulo || "Atendimento"}
        `;

        lista.appendChild(div);
    });
}

/* INIT */
carregarClientes();
carregarAnimais();
carregarAgenda();

</script>

</body>
</html>
