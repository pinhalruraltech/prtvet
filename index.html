<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  display:none;
  font-family:Arial;
  background:#f5f7f9;
}

.cards {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.card {
  background:#fff;
  padding:20px;
  border:1px solid #ccc;
  border-radius:8px;
}
</style>
</head>

<body>

<div id="menu-container"></div>

<div id="conteudo">
  <div class="cards">
    <div class="card">12</div>
    <div class="card">248</div>
    <div class="card">132</div>
    <div class="card">9</div>
  </div>
</div>

<!-- LUCIDE -->
<script src="https://unpkg.com/lucide@latest"></script>

<script>
fetch('./menu/menu.html')
.then(r => r.text())
.then(html => {

  // 1. INJETA MENU
  document.getElementById('menu-container').innerHTML = html;

  // 2. MOVE CONTEÚDO PARA DENTRO DO LAYOUT
  const appContent = document.getElementById('app-content');
  const conteudo = document.getElementById('conteudo');

  if (appContent && conteudo) {
    appContent.appendChild(conteudo);
  }

  // 3. INICIALIZA MENU (se existir)
  if (typeof initMenu === "function") {
    initMenu();
  }

  // 4. BOTÃO MENU (só se existir)
  const toggle = document.getElementById('toggle-menu');
  const sidebar = document.getElementById('sidebar');

  if (toggle && sidebar) {
    toggle.onclick = () => {
      sidebar.classList.toggle('collapsed');
    };
  }

  // 5. TÍTULO (se existir)
  const titulo = document.getElementById('titulo-pagina');
  if (titulo) {
    titulo.innerText = "Dashboard";
  }

  // 6. ICONES
  if (window.lucide) {
    lucide.createIcons();
  }

  // 7. LIBERA TELA (SEMPRE)
  document.body.style.display = "block";

})
.catch(err => {
  console.error("Erro ao carregar menu:", err);

  // Mesmo com erro, não trava tela
  document.body.style.display = "block";
});
</script>

</body>
</html>
