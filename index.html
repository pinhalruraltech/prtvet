<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #F8FAFC;
    color: #1F2933;
}

/* LAYOUT */
.main {
    margin-left: 240px;
    padding: 24px;
}

/* MOBILE */
@media (max-width: 768px) {
    .main {
        margin-left: 0;
        padding: 16px;
    }
}

/* HEADER */
.page-header {
    margin-bottom: 24px;
}

.page-header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.3px;
}

/* GRID */
.grid {
    display: grid;
    gap: 16px;
}

.grid-4 {
    grid-template-columns: repeat(4, 1fr);
}

@media (max-width: 900px) {
    .grid-4 {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .grid-4 {
        grid-template-columns: 1fr;
    }
}

/* CARDS */
.card {
    background: #FFFFFF;
    border-radius: 12px;
    border: 1px solid #E3E8EE;
    padding: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.04);
}

/* CARD STATS */
.stat-card {
    display: flex;
    align-items: center;
    gap: 12px;
}

.stat-card i {
    background: #E6F4EA;
    color: #2D6A4F;
    padding: 10px;
    border-radius: 8px;
}

.card-title {
    font-size: 13px;
    color: #6B7280;
}

.card-value {
    font-size: 22px;
    font-weight: 600;
    margin-top: 5px;
}

/* SEÇÕES */
.section {
    margin-top: 20px;
}

/* LISTA */
.list-item {
    padding: 12px 0;
    border-bottom: 1px solid #E3E8EE;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* BOTÃO */
.fab {
    position: fixed;
    bottom: 80px;
    right: 20px;
    background: linear-gradient(135deg, #2D6A4F, #40916C);
    color: white;
    border-radius: 50px;
    padding: 14px 18px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    font-weight: 500;
}

/* FOOTER */
.footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #2D6A4F;
    color: white;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    z-index: 999;
}

</style>

</head>

<body>

<!-- MENU -->
<div id="menu-container"></div>

<!-- MAIN -->
<div class="main">

    <div class="page-header">
        <h1>Dashboard</h1>
    </div>

    <!-- CARDS -->
    <div class="grid grid-4">

        <div class="card stat-card">
            <i data-lucide="users"></i>
            <div>
                <div class="card-title">Clientes</div>
                <div class="card-value">128</div>
            </div>
        </div>

        <div class="card stat-card">
            <i data-lucide="paw-print"></i>
            <div>
                <div class="card-title">Pacientes</div>
                <div class="card-value">342</div>
            </div>
        </div>

        <div class="card stat-card">
            <i data-lucide="stethoscope"></i>
            <div>
                <div class="card-title">Atendimentos Hoje</div>
                <div class="card-value">12</div>
            </div>
        </div>

        <div class="card stat-card">
            <i data-lucide="bed"></i>
            <div>
                <div class="card-title">Internações</div>
                <div class="card-value">3</div>
            </div>
        </div>

    </div>

    <!-- AGENDA -->
    <div class="section card">
        <strong>Agenda</strong>

        <div class="list-item">
            <span>Thor - Consulta</span>
            <span>09:00</span>
        </div>

        <div class="list-item">
            <span>Mel - Vacina</span>
            <span>10:30</span>
        </div>

        <div class="list-item">
            <span>Rex - Retorno</span>
            <span>14:00</span>
        </div>
    </div>

    <!-- ALERTAS -->
    <div class="section card">
        <strong>Alertas</strong>

        <div class="list-item">
            <span>Vacinas vencendo</span>
        </div>

        <div class="list-item">
            <span>Produtos próximos da validade</span>
        </div>
    </div>

</div>

<!-- BOTÃO NOVO ATENDIMENTO -->
<button class="fab">
    <i data-lucide="plus"></i>
    Novo Atendimento
</button>

<!-- FOOTER -->
<div class="footer">
    <div>Usuário: Venício</div>
    <div>AppVet v1.0.0</div>
    <div>Sair</div>
</div>

<!-- MENU LOAD -->
<script>
fetch("menu/menu.html")
.then(res => res.text())
.then(data => {
    document.getElementById("menu-container").innerHTML = data;
});
</script>

<!-- LUCIDE -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
lucide.createIcons();
</script>

</body>
</html>
