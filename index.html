<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #F1F5F9;
    color: #1F2933;
}

/* LAYOUT */
.main {
    margin-left: 240px;
    padding: 24px;
}

@media (max-width: 768px) {
    .main {
        margin-left: 0;
        padding: 16px;
    }
}

/* HEADER */
.page-header h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 20px;
}

/* GRID */
.grid {
    display: grid;
    gap: 20px;
}

.grid-4 {
    grid-template-columns: repeat(4, 1fr);
}

.grid-2 {
    grid-template-columns: repeat(2, 1fr);
}

@media (max-width: 900px) {
    .grid-4, .grid-2 {
        grid-template-columns: 1fr;
    }
}

/* CARDS */
.card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 18px;
    border: 1px solid #E5EAF0;
    box-shadow: 0 6px 14px rgba(0,0,0,0.04);
}

/* STATS */
.stat-card {
    display: flex;
    align-items: center;
    gap: 14px;
}

.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-blue { background: #E0F2FE; color: #0284C7; }
.icon-green { background: #DCFCE7; color: #16A34A; }
.icon-purple { background: #EDE9FE; color: #7C3AED; }
.icon-orange { background: #FFF7ED; color: #EA580C; }

.card-title {
    font-size: 13px;
    color: #6B7280;
}

.card-value {
    font-size: 22px;
    font-weight: 600;
}

/* BLOCO CABEÇALHO */
.card-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-weight: 500;
}

/* ITENS MODERNOS */
.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    border-radius: 12px;
    transition: 0.2s;
}

.item:hover {
    background: #F8FAFC;
}

.item-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.item-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* FAB */
.fab {
    position: fixed;
    bottom: 80px;
    right: 20px;
    background: linear-gradient(135deg, #2D6A4F, #40916C);
    color: white;
    border-radius: 50px;
    padding: 14px 20px;
    border: none;
    display: flex;
    gap: 8px;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.2);
}

/* FOOTER */
.footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #2D6A4F;
    color: white;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
}

</style>

</head>

<body>

<div id="menu-container"></div>

<div class="main">

    <div class="page-header">
        <h1>Dashboard</h1>
    </div>

    <!-- STATS -->
    <div class="grid grid-4">

        <div class="card stat-card">
            <div class="stat-icon icon-blue">
                <i data-lucide="stethoscope"></i>
            </div>
            <div>
                <div class="card-value">3</div>
                <div class="card-title">Atendimentos</div>
            </div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon icon-purple">
                <i data-lucide="paw-print"></i>
            </div>
            <div>
                <div class="card-value">128</div>
                <div class="card-title">Pacientes</div>
            </div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon icon-green">
                <i data-lucide="users"></i>
            </div>
            <div>
                <div class="card-value">78</div>
                <div class="card-title">Clientes</div>
            </div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon icon-orange">
                <i data-lucide="bed"></i>
            </div>
            <div>
                <div class="card-value">2</div>
                <div class="card-title">Internações</div>
            </div>
        </div>

    </div>

    <!-- BLOCOS -->
    <div class="grid grid-2" style="margin-top:20px;">

        <!-- AGENDA -->
        <div class="card">
            <div class="card-header">
                <span>Agenda</span>
                <span>...</span>
            </div>

            <div class="item">
                <div class="item-left">
                    <div class="item-icon icon-blue">
                        <i data-lucide="calendar"></i>
                    </div>
                    <div>
                        <strong>Hoje</strong><br>
                        <small>24 atendimentos</small>
                    </div>
                </div>
                <i data-lucide="chevron-right"></i>
            </div>

            <div class="item">
                <div class="item-left">
                    <div class="item-icon icon-green">
                        <i data-lucide="calendar-days"></i>
                    </div>
                    <div>
                        <strong>Semana</strong><br>
                        <small>24 atendimentos</small>
                    </div>
                </div>
                <i data-lucide="chevron-right"></i>
            </div>

        </div>

        <!-- ALERTAS -->
        <div class="card">
            <div class="card-header">
                <span>Alertas</span>
                <span>...</span>
            </div>

            <div class="item">
                <div class="item-left">
                    <div class="item-icon icon-orange">
                        <i data-lucide="alert-circle"></i>
                    </div>
                    <div>
                        <strong>Produtos vencendo</strong><br>
                        <small>26 itens</small>
                    </div>
                </div>
                <i data-lucide="chevron-right"></i>
            </div>

            <div class="item">
                <div class="item-left">
                    <div class="item-icon icon-purple">
                        <i data-lucide="syringe"></i>
                    </div>
                    <div>
                        <strong>Vacinas vencendo</strong><br>
                        <small>22 itens</small>
                    </div>
                </div>
                <i data-lucide="chevron-right"></i>
            </div>

        </div>

    </div>

</div>

<button class="fab">
    <i data-lucide="plus"></i>
    Novo Atendimento
</button>

<div class="footer">
    <div>Usuário: Venício</div>
    <div>AppVet v1.0.0</div>
    <div>Sair</div>
</div>

<script>
fetch("menu/menu.html")
.then(res => res.text())
.then(data => {
    document.getElementById("menu-container").innerHTML = data;
});
</script>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
lucide.createIcons();
</script>

</body>
</html>
