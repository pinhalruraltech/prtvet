<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | AppVet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #F1F5F9;
}

/* TOPBAR */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    background: white;
    border-bottom: 1px solid #E5EAF0;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

#menu-btn {
    background: none;
    border: none;
    cursor: pointer;
}

/* MAIN */
.main {
    margin-left: 240px;
    padding: 20px;
}

@media (max-width: 768px) {
    .main {
        margin-left: 0;
    }
}

/* GRID */
.grid {
    display: grid;
    gap: 16px;
}

.grid-4 {
    grid-template-columns: repeat(4, 1fr);
}

.grid-2 {
    grid-template-columns: repeat(2, 1fr);
}

@media (max-width: 900px) {
    .grid-4, .grid-2 {
        grid-template-columns: 1fr;
    }
}

/* CARD */
.card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    border: 1px solid #E5EAF0;
}

/* STATS */
.stat-card {
    display: flex;
    gap: 12px;
    align-items: center;
}

.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-blue { background:#E0F2FE; color:#0284C7; }
.icon-green { background:#DCFCE7; color:#16A34A; }
.icon-purple { background:#EDE9FE; color:#7C3AED; }
.icon-orange { background:#FFF7ED; color:#EA580C; }

.card-title { font-size: 13px; color:#6B7280; }
.card-value { font-size:22px; font-weight:600; }

/* ITEM */
.item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
}

.item:hover {
    background:#F8FAFC;
}

/* FOOTER */
.footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #2D6A4F;
    color: white;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

</style>

</head>

<body>

<!-- MENU -->
<div id="menu-container"></div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <button id="menu-btn">
            <i data-lucide="menu"></i>
        </button>
        <strong>Dashboard</strong>
    </div>

    <button onclick="novoAtendimento()" style="background:#2D6A4F;color:white;border:none;padding:10px 14px;border-radius:8px;">
        + Novo Atendimento
    </button>
</div>

<!-- MAIN -->
<div class="main">

    <div class="grid grid-4">

        <div class="card stat-card">
            <div class="stat-icon icon-blue"><i data-lucide="stethoscope"></i></div>
            <div><div class="card-value">3</div><div class="card-title">Atendimentos</div></div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon icon-purple"><i data-lucide="paw-print"></i></div>
            <div><div class="card-value">128</div><div class="card-title">Pacientes</div></div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon icon-green"><i data-lucide="users"></i></div>
            <div><div class="card-value">78</div><div class="card-title">Clientes</div></div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon icon-orange"><i data-lucide="bed"></i></div>
            <div><div class="card-value">2</div><div class="card-title">Internações</div></div>
        </div>

    </div>

    <div class="grid grid-2" style="margin-top:20px;">

        <!-- AGENDA -->
        <div class="card">
            <strong>Agenda</strong>

            <div class="item" onclick="irAgenda('hoje')">
                <span>Hoje - 24 atendimentos</span>
                <i data-lucide="chevron-right"></i>
            </div>

            <div class="item" onclick="irAgenda('semana')">
                <span>Semana - 24 atendimentos</span>
                <i data-lucide="chevron-right"></i>
            </div>
        </div>

        <!-- ALERTAS -->
        <div class="card">
            <strong>Alertas</strong>

            <div class="item" onclick="abrirAlerta('produtos')">
                <span>Produtos vencendo</span>
                <i data-lucide="chevron-right"></i>
            </div>

            <div class="item" onclick="abrirAlerta('vacinas')">
                <span>Vacinas vencendo</span>
                <i data-lucide="chevron-right"></i>
            </div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    <div id="usuarioNome">Usuário: ...</div>
    <div>AppVet v1.0.0</div>
    <div>PRT Soluções</div>
</div>

<!-- SCRIPTS -->
<script src="https://unpkg.com/lucide@latest"></script>

<script>

// MENU
fetch("menu/menu.html")
.then(res => res.text())
.then(data => {
    document.getElementById("menu-container").innerHTML = data;

    setTimeout(() => {
        const btn = document.getElementById("menu-btn");
        const sidebar = document.getElementById("sidebar");

        if(btn && sidebar){
            btn.addEventListener("click", () => {
                sidebar.classList.toggle("open");
            });
        }

        lucide.createIcons();
    }, 100);
});

// USUÁRIO (SIMULADO POR ENQUANTO)
const usuario = "Venício";
document.getElementById("usuarioNome").innerText = "Usuário: " + usuario;

// AÇÕES
function novoAtendimento(){
    window.location.href = "app/atendimentos.html";
}

function irAgenda(tipo){
    window.location.href = "app/agenda.html?view=" + tipo;
}

function abrirAlerta(tipo){
    window.location.href = "app/estoque.html?alerta=" + tipo;
}

</script>

</body>
</html>
